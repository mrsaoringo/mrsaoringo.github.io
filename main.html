<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#A8CCBA">
<title>green or blue?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root {
  --mint: #A8CCBA;
  --navy: #203354;
  --white: #F5F5F0;
  --line: rgba(32, 51, 84, .45);
  --title-font: 'Megrim', cursive;
  --body-font: '07LogoTypeGothic', sans-serif;
}

/*
@font-face {
  font-family: '07LogoTypeGothic';
  src: url('fonts/07ロゴたいぷゴシック.ttf') format('truetype');
  font-display: swap;
}
*/

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--mint);
  color: var(--navy);
  font-family: var(--body-font);
  font-size: 13px;
  line-height: 1.9;
  letter-spacing: .04em;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
}

/* NAVIGATION */

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(8px, 2.5vw, 16px);
  width: 100%;
}

.nav-button {
  display: inline-block;
  padding: 3px 4px;
  color: var(--mint);
  font-family: var(--title-font);
  font-size: clamp(12px, 3.2vw, 16px);
  letter-spacing: .06em;
  border-bottom: 1px solid transparent;
  transition: .25s;
}

.nav-button:hover {
  border-bottom-color: var(--mint);
  opacity: .7;
}

/* =========================
   FIXED HEADER
========================= */

.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  width: 100%;
  padding: 0px 0px 20px;
  background: var(--mint);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  width: min(100%, 650px);
  margin: 0 auto;
}

/* NAME CHANGE */

.reader-name-form {
  width: 100%;
  max-width: 425px;
  margin: 0 auto;
}

.name-heading {
  margin-top: -20px;
  margin-bottom: 25px;
  text-align: center;
  font-family: var(--title-font);
  font-size: 12px;
  letter-spacing: .15em;
}

.reader-name-fields {
  display: flex;
  align-items: center;
  gap: 8px;
}

.reader-name-fields label {
  flex: 1;
  min-width: 0;
}

.reader-name-fields input {
  display: block;
  width: 100%;
  height: 36px;
  padding: 5px 10px;
  border: 1px solid var(--navy);
  border-radius: 0;
  background: transparent;
  color: var(--navy);
  font-size: 12px;
  outline: none;
}

.reader-name-fields input::placeholder {
  color: var(--navy);
  opacity: .7;
}

.reader-name-fields input:focus {
  background: rgba(245, 245, 240, .35);
}

.name-submit {
  flex-shrink: 0;
  height: 36px;
  padding: 0 17px;
  border: 1px solid var(--navy);
  border-radius: 0;
  background: var(--navy);
  color: var(--mint);
  font-size: 12px;
  letter-spacing: .08em;
  cursor: pointer;
  transition: .25s;
}

.name-submit:hover {
  background: transparent;
  color: var(--navy);
}

.reader-name-message {
  min-height: 0;
  margin: 3px 0 0;
  text-align: center;
  font-size: 10px;
  line-height: 1.5;
}

#readerNameMessage:empty {
  display: none;
}

/* =========================
   COMMON
========================= */

.container {
  width: min(90%, 650px);
  margin: 0 auto;
}

section {
  padding: 55px 0;
}

.divider {
  width: 100%;
  border: 0;
  border-top: 1px solid var(--line);
  margin: 0;
}

.section-title {
  margin: 0 0 25px;
  text-align: center;
  font-family: var(--title-font);
  font-size: 35px;
  font-weight: normal;
  letter-spacing: .08em;
}

.section-subtitle {
  margin-top: -20px;
  margin-bottom: 25px;
  text-align: center;
  font-family: var(--title-font);
  font-size: 12px;
  letter-spacing: .15em;
}

/* =========================
   INFORMATION
========================= */

.info-box {
  border: 1px solid var(--navy);
  padding: 20px;
  margin-bottom: 20px;
}

.info-heading {
  margin: 0 0 12px;
  font-family: var(--title-font);
  font-size: 20px;
  font-weight: normal;
  border-bottom: 1px solid var(--line);
  padding-bottom: 7px;
}

.info-text {
  font-size: 12px;
  line-height: 2.2;
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 30px 15px 45px;
  text-align: center;
  font-family: var(--title-font);
  font-size: 11px;
  letter-spacing: .15em;
}

footer .copyright {
  margin-top: 8px;
  font-family: var(--body-font);
  font-size: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  .container {
    width: 88%;
  }

  section {
    padding: 42px 0;
  }

  .section-title {
    font-size: 31px;
  }
}
</style>
</head>

<body>

<!-- FIXED HEADER -->

<header class="fixed-header">

  <div class="header-inner">

    <section id="information">
      
      <div class="container">
        
        <h2 class="section-title">MAIN</h2>
        <div class="section-subtitle">NAME CHANGE</div>

         <form id="readerNameForm" class="reader-name-form">
           <div class="reader-name-fields">
             <label>
               <input
                 type="text"
                 id="readerSurname"
                 autocomplete="family-name"
                 placeholder="苗字"
                 aria-label="苗字"
                  >
             </label>
            
             <label>
               <input
                type="text"
                id="readerName"
                autocomplete="given-name"
                placeholder="名前"
                aria-label="名前"
                 >
             </label>
             <button type="submit" class="name-submit">
               変更
             </button>
           </div>
           <p id="readerNameMessage" class="reader-name-message" aria-live="polite"></p>
         </form>
      
      </div>
    
    </section>
  
  </div>

</header>
  

<!-- MAIN -->

<section id="information">

  <div class="container">

    <h2 class="section-title">MAIN</h2>
    <div class="section-subtitle">NAME CHANGE</div>

    <div class="info-box">

      <h3 class="info-heading">WELCOME</h3>

      <div class="info-text">
        当サイトは個人が運営する二次創作・夢小説サイトです。<br>
        実在する人物・団体・作品等を題材とした夢小説を取り扱っておりますが、ご本人様・関係各社様とは一切関係ありません。<br>
        ご理解いただける方のみ、以下の注意事項をご確認のうえ閲覧をお願いいたします。
      </div>

    </div>

      </div>

</section>


<hr class="divider">

<!-- FOOTER -->

<footer>

  <div style="margin-top:15px;">
    <a href="https://mrsaoringo.github.io/index.html">BACK TO TOP</a>
  </div>

</footer>

</body>
</html>
