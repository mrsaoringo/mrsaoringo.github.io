<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>murmur | green or blue?</title>

<style>

@charset "UTF-8";

/* Template & Designed by Towako. */
/* https://ninawas.me */

/* ウェブフォントの読み込み */
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Unica+One&display=swap');


/* ====================================
   全体に適用する
==================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-weight: normal;
    font-family: 'Kosugi Maru', sans-serif;
}


/* ====================================
   基本設定
==================================== */

body {
    background-color: #fff;
    text-align: center;
    line-height: 1.7;
    letter-spacing: 0.1em;
    font-size: 13px;
    color: #888;
}


/* ====================================
   リンク
==================================== */

a {
    color: #888;
}


/* ====================================
   セクション
==================================== */

section {
    padding: 3em;
    text-align: justify;
    word-break: break-all;
}


/* ====================================
   タイトル
   トップページのABOUT MEと同じ設定
==================================== */

section h2 {
    text-align: center;
    font-weight: bold;
    margin-bottom: 2em;
    font-family: 'Unica One', cursive;
    letter-spacing: 0.15em;
    color: #888;
}


/* ====================================
   murmur
==================================== */

.murmur-list {
    margin: 0 auto;
    width: 100%;
    max-width: 650px;
}


/* 投稿ひとつ分 */

.murmur-item {
    margin-bottom: 3em;
    padding-bottom: 2em;
    border-bottom: 1px solid #ddd;
}


/* 日付 */

.murmur-date {
    margin-bottom: 0.8em;
    color: #aaa;
    font-family: 'Unica One', cursive;
    font-size: 1em;
    letter-spacing: 0.1em;
}


/* UP / murmur のラベル */

.murmur-type {
    display: inline-block;
    margin-right: 0.5em;
    padding: 0 0.6em;
    background-color: #999;
    color: #fff;
    font-size: 0.75em;
    letter-spacing: 0.05em;
}


/* 本文 */

.murmur-text {
    text-align: left;
    line-height: 2;
    white-space: pre-wrap;
}


/* ====================================
   画像
==================================== */

.murmur-image {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 1em auto 0;
}


/* ====================================
   投稿がないとき
==================================== */

.no-murmur {
    text-align: center;
    padding: 3em 0;
}


/* ====================================
   トップへ戻る
==================================== */

.back {
    margin-top: 4em;
    text-align: center;
}

.back a {
    display: inline-block;
    padding: 0.5em 1.5em;
    background-color: #999;
    color: #fff;
    text-decoration: none;
    border-bottom-right-radius: 20px;
}

.back a:hover {
    opacity: 0.8;
}


/* ====================================
   横幅768px以上
==================================== */

@media screen and (min-width: 768px) {

    body {
        font-size: 14px;
    }

}


/* ====================================
   横幅1024px以上
==================================== */

@media screen and (min-width: 1024px) {

    body {
        font-size: 15px;
    }

}


/* ====================================
   スマートフォン用
==================================== */

@media screen and (max-width: 767px) {

    section {
        padding: 3em 2em;
    }

}

</style>
</head>


<body>


<!-- ====================================
     MURMUR
==================================== -->

<section>

<h2>murmur</h2>


<div class="murmur-list" id="murmur-list">

    <div class="no-murmur">
        読み込み中……
    </div>

</div>


<!-- トップへ戻る -->

<div class="back">

    <a href="index.html">
        TOPへ戻る
    </a>

</div>


</section>


<!-- ====================================
     murmur-data.jsonを読み込む
==================================== -->

<script>

fetch('murmur-data.json')
    .then(function(response) {

        if (!response.ok) {
            throw new Error('データを読み込めませんでした');
        }

        return response.json();

    })

    .then(function(data) {

        const list = document.getElementById('murmur-list');

        list.innerHTML = '';


        /* 投稿を新しい順に並べる */

        data.sort(function(a, b) {

            return new Date(b.date) - new Date(a.date);

        });


        /* 投稿がない場合 */

        if (data.length === 0) {

            list.innerHTML =
                '<div class="no-murmur">' +
                'まだ投稿はありません。' +
                '</div>';

            return;

        }


        /* 投稿を表示 */

        data.forEach(function(item) {

            const article = document.createElement('article');

            article.className = 'murmur-item';


            /* 日付 */

            const date = document.createElement('div');

            date.className = 'murmur-date';

            date.textContent = item.date;


            /* 本文 */

            const text = document.createElement('div');

            text.className = 'murmur-text';


            /* 種類 */

            if (item.type) {

                const type = document.createElement('span');

                type.className = 'murmur-type';

                type.textContent = item.type;

                text.appendChild(type);

            }


            /* 本文 */

            const message = document.createElement('span');

            message.textContent = item.text;

            text.appendChild(message);


            /* 本文を追加 */

            article.appendChild(date);

            article.appendChild(text);


            /* 画像 */

            if (item.image) {

                const image = document.createElement('img');

                image.className = 'murmur-image';

                image.src = item.image;

                image.alt = '';

                article.appendChild(image);

            }


            list.appendChild(article);

        });

    })


    .catch(function(error) {

        console.error(error);

        document.getElementById('murmur-list').innerHTML =
            '<div class="no-murmur">' +
            '投稿を読み込めませんでした。' +
            '</div>';

    });

</script>


</body>
</html>
