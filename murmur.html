
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>murmur | green or blue?</title>

<link rel="stylesheet" href="style.css">

<style>

/* 日付と種類を横並びにする */

.murmur-meta {
    display: flex;
    align-items: center;
    gap: 0.7em;
    margin-bottom: 0.8em;
}

/* 日付の余白を調整 */

.murmur-date {
    margin-bottom: 0;
}

/* 本文 */

.murmur-text {
    text-align: left;
    line-height: 2;
    white-space: pre-wrap;
}

</style>

</head>

<body>

<section>

<h2 style="text-align: center;">murmur</h2>

<div class="murmur-list" id="murmur-list">

    <div class="no-murmur">
        読み込み中……
    </div>

</div>


<!-- TOPへ戻る -->

<div class="back">

    <a href="index.html">
        TOPへ戻る
    </a>

</div>

</section>


<script>

fetch('murmur-data.json?v=' + Date.now(), {
    cache: 'no-store'
})

    .then(function(response) {

        if (!response.ok) {
            throw new Error('データを読み込めませんでした');
        }

        return response.json();

    })

    .then(function(data) {

        const list = document.getElementById('murmur-list');

        list.innerHTML = '';


        /* 投稿を新しい順に並べる */

        data.sort(function(a, b) {

            return new Date(b.date) - new Date(a.date);

        });


        /* 投稿がない場合 */

        if (data.length === 0) {

            list.innerHTML =
                '<div class="no-murmur">' +
                'まだ投稿はありません。' +
                '</div>';

            return;

        }


        /* 投稿を表示 */

        data.forEach(function(item) {

            const article = document.createElement('article');

            article.className = 'murmur-item';


            /* 日付と種類をまとめる */

            const meta = document.createElement('div');

            meta.className = 'murmur-meta';


            /* 日付 */

            const date = document.createElement('div');

            date.className = 'murmur-date';

            date.textContent = item.date;

            meta.appendChild(date);


            /* 種類 */

            if (item.type) {

                const type = document.createElement('span');

                type.className = 'murmur-type';

                type.textContent = item.type;

                meta.appendChild(type);

            }


            /* 本文 */

            const text = document.createElement('div');

            text.className = 'murmur-text';


            const message = document.createElement('span');

            message.textContent = item.text;

            text.appendChild(message);


            /* 投稿内容を追加 */

            article.appendChild(meta);

            article.appendChild(text);


            /* 画像 */

            if (item.image) {

                const image = document.createElement('img');

                image.className = 'murmur-image';

                image.src = item.image;

                image.alt = '';

                article.appendChild(image);

            }


            list.appendChild(article);

        });

    })


    /* 読み込みエラー */

    .catch(function(error) {

        console.error(error);

        document.getElementById('murmur-list').innerHTML =
            '<div class="no-murmur">' +
            '投稿を読み込めませんでした。' +
            '</div>';

    });

</script>

</body>
</html>
