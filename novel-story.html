
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>novel story</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width:100%; color:#888; }

    body > section {
      display:block;
      width:100%;
      max-width:none;
      margin-left:auto !important;
      margin-right:auto !important;
      padding-left:1.5em;
      padding-right:1.5em;
      box-sizing:border-box;
    }

    .story-width { width:100%; max-width:600px; margin:0 auto; }

    .series-heading {
      width:100%;
      max-width:600px;
      margin-left:auto;
      margin-right:auto;
      color:#888;
      font-family:inherit;
      font-size:1.15em;
      font-weight:400;
      letter-spacing:inherit;
      line-height:2;
      text-align:right;
    }

    .episode-list { text-align:left; }
    .episode-link-item { padding:1.2em 0; border-bottom:1px solid #ddd; }
    .episode-link-item a { color:inherit; text-decoration:none; }
    .episode-link-item a:hover { opacity:.75; }
    .episode-number { margin-right:.6em; color:#888; font-size:.85em; }

    .episode-page-title {
      margin:0 0 1.5em;
      color:#888;
      font-size:1.1em;
      font-weight:400;
      line-height:1.8;
    }

    .episode-body {
      line-height:2;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      text-align:left;
    }

    .episode-navigation {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:.8em;
      margin-top:2.5em;
    }

    .square-link, .reader-name-form button {
      display:inline-block;
      padding:.5em 1.2em;
      border:0;
      border-radius:0;
      background:#999;
      color:#fff;
      font:inherit;
      font-size:.9em;
      letter-spacing:.1em;
      text-decoration:none;
      cursor:pointer;
    }

    .square-link:hover, .reader-name-form button:hover { opacity:.8; }
    .square-link.disabled { background:#bbb; pointer-events:none; }

    .page-message {
      max-width:600px;
      margin:0 auto;
      padding:2em 0;
      color:#888;
      text-align:center;
      line-height:1.8;
    }

    .page-message:empty { display:none; }
    .error-message { color:#b66; }
    .back { margin-top:3em; text-align:center; }

    .back a {
      display:inline-block;
      padding:.5em 1.2em;
      border:0;
      border-radius:0;
      background:#999;
      color:#fff;
      text-decoration:none;
    }

    .back a:hover { opacity:.8; }


    /* =========================
       X風投稿カード
    ========================= */

    .x-post {
      display:block;
      width:100%;
      box-sizing:border-box;
      margin:1.8em 0;
      padding:16px;
      border:1px solid #e1e8ed;
      border-radius:16px;
      background:#fff;
      color:#0f1419;
      font-family:Arial, "Noto Sans JP", sans-serif;
      line-height:1.5;
      white-space:normal;
      overflow-wrap:anywhere;
    }

    .x-post-header {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .x-post-avatar {
      flex-shrink:0;
      width:48px;
      height:48px;
      border-radius:50%;
      object-fit:cover;
      background:#eee;
    }

    .x-post-avatar-placeholder {
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#888;
    }

    .x-post-user {
      min-width:0;
      flex:1;
    }

    .x-post-name {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:5px;
      font-size:14px;
      font-weight:700;
      line-height:1.4;
    }

    .x-post-verified {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:17px;
      height:17px;
      border-radius:50%;
      background:#1d9bf0;
      color:#fff;
      font-size:11px;
      font-weight:bold;
    }

    .x-post-id {
      color:#657786;
      font-size:13px;
      line-height:1.4;
      overflow-wrap:anywhere;
    }

    .x-post-logo {
      flex-shrink:0;
      color:#0f1419;
      font-size:19px;
      font-weight:bold;
      letter-spacing:-1px;
    }

    .x-post-text {
      margin:20px 0;
      color:#0f1419;
      font-size:14px;
      line-height:1.7;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .x-post-date {
      color:#657786;
      font-size:12px;
      line-height:1.6;
    }

    .x-post-engagement {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin-top:20px;
      color:#657786;
      font-size:14px;
    }

    .x-post-stat {
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }

    .x-post-stat-icon {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:20px;
      height:20px;
      font-size:21px;
      line-height:1;
    }

    .x-post-stat-icon svg {
      display:block;
      width:19px;
      height:19px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    @media (max-width:480px) {
      .x-post {
        padding:13px;
        border-radius:14px;
      }

      .x-post-avatar {
        width:42px;
        height:42px;
      }
      
      .x-post-engagement {
        gap:10px;
        font-size:12px;
      }

      .x-post-stat-icon { font-size:18px; }
    }
  </style>
</head>

<body>
<section>
  <h2 id="seriesHeading" class="series-heading">novel</h2>
  <p id="pageMessage" class="page-message">小説を読み込み中……</p>

  <div id="episodeList" class="story-width episode-list hidden"></div>

  <article id="episodeView" class="story-width hidden">
    <div id="episodeTitle" class="episode-page-title" role="heading" aria-level="3"></div>
    <div id="episodeBody" class="episode-body"></div>
    <nav id="episodeNavigation" class="episode-navigation" aria-label="話の移動"></nav>
  </article>

  <div class="back"><a href="novel.html">シリーズ一覧へ戻る</a></div>
</section>

<script>
  const DATA_URL = "./novel-data.json";
  const params = new URLSearchParams(location.search);
  const seriesId = params.get("seriesId");
  const episodeId = params.get("episodeId");
  const $ = id => document.getElementById(id);

  function showError(text) {
    $("pageMessage").textContent = text;
    $("pageMessage").classList.add("error-message");
  }

  function makeEpisodeUrl(id = "") {
    const query = new URLSearchParams({ seriesId });
    if (id) query.set("episodeId", id);
    return `novel-story.html?${query.toString()}`;
  }

  function personalText(text) {
    const surname = localStorage.getItem("novelSurname") || "";
    const name = localStorage.getItem("novelName") || "";

    return String(text ?? "")
      .replaceAll("{surname}", surname)
      .replaceAll("{name}", name);
  }


  /* X風投稿カード */

  function createXPost(block) {
    const separator = block.indexOf("\n---");

    if (separator === -1) {
      return document.createTextNode("[[XPOST]]" + block + "[[/XPOST]]");
    }

    const headerText = block.slice(0, separator);
    const postText = block.slice(separator + 4).replace(/^\n/, "");
    const settings = {};

    headerText.split("\n").forEach(line => {
      const equalIndex = line.indexOf("=");
      if (equalIndex === -1) return;

      const key = line.slice(0, equalIndex).trim();
      const value = line.slice(equalIndex + 1).trim();

      if (key) settings[key] = value;
    });

    const card = document.createElement("div");
    card.className = "x-post";

    const header = document.createElement("div");
    header.className = "x-post-header";

    if (settings.avatar) {
      const avatar = document.createElement("img");
      avatar.className = "x-post-avatar";
      avatar.src = settings.avatar;
      avatar.alt = "";
      avatar.loading = "lazy";
      header.appendChild(avatar);
    } else {
      const avatar = document.createElement("div");
      avatar.className = "x-post-avatar x-post-avatar-placeholder";
      avatar.textContent = "○";
      header.appendChild(avatar);
    }

    const user = document.createElement("div");
    user.className = "x-post-user";

    const name = document.createElement("div");
    name.className = "x-post-name";
    name.textContent = personalText(settings.name || "名前未設定");

    if (settings.verified === "true") {
      const verified = document.createElement("span");
      verified.className = "x-post-verified";
      verified.textContent = "✓";
      name.appendChild(verified);
    }

    const id = document.createElement("div");
    id.className = "x-post-id";
    id.textContent = settings.id || "";

    user.appendChild(name);
    user.appendChild(id);

    const logo = document.createElement("div");
    logo.className = "x-post-logo";
    logo.textContent = "𝕏.com";

    header.appendChild(user);
    header.appendChild(logo);
    card.appendChild(header);

    const text = document.createElement("div");
    text.className = "x-post-text";
    text.textContent = personalText(postText);
    card.appendChild(text);

    if (settings.date || settings.views) {
      const date = document.createElement("div");
      date.className = "x-post-date";
      date.textContent = [
        settings.date,
        settings.views
      ].filter(Boolean).join(" · ");

      card.appendChild(date);
    }

    const stats = [
      ["replies", "reply", "返信"],
      ["reposts", "repost", "リポスト"],
      ["likes", "like", "いいね"],
      ["bookmarks", "bookmark", "ブックマーク"]
    ];

    const icons = {
      reply: `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      `,
      repost: `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m17 1 4 4-4 4"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="m7 23-4-4 4-4"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      `,
      like: `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>
        </svg>
      `,
      bookmark: `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4.75A1.75 1.75 0 0 1 7.75 3h8.5A1.75 1.75 0 0 1 18 4.75V21l-6-4-6 4V4.75Z"/>
        </svg>
      `
    };

    const engagement = document.createElement("div");
    engagement.className = "x-post-engagement";

    let hasStats = false;

    stats.forEach(([key, iconName, label]) => {
      if (!settings[key]) return;

      hasStats = true;

      const item = document.createElement("div");
      item.className = "x-post-stat";
      item.setAttribute("aria-label", label);

      const icon = document.createElement("span");
      icon.className = "x-post-stat-icon";
      icon.innerHTML = icons[iconName];

      const value = document.createElement("span");
      value.textContent = settings[key];

      item.appendChild(icon);
      item.appendChild(value);
      engagement.appendChild(item);
    });

    if (hasStats) card.appendChild(engagement);

    return card;
  }


  /* 本文の表示・X投稿の変換 */

  function renderContent(content) {
    const container = $("episodeBody");
    container.replaceChildren();

    const text = personalText(content || "");
    const pattern = /\[\[XPOST\]\]\s*\n([\s\S]*?)\n\[\[\/XPOST\]\]/g;

    let lastIndex = 0;
    let match;

    while ((match = pattern.exec(text)) !== null) {
      const before = text.slice(lastIndex, match.index);

      if (before) {
        container.appendChild(document.createTextNode(before));
      }

      container.appendChild(createXPost(match[1]));
      lastIndex = pattern.lastIndex;
    }

    const remaining = text.slice(lastIndex);

    if (remaining) {
      container.appendChild(document.createTextNode(remaining));
    }
  }


  function renderEpisodeList(series, episodes) {
    $("episodeList").replaceChildren();

    if (episodes.length === 0) {
      $("pageMessage").textContent = "このシリーズには、まだ話がありません。";
      $("pageMessage").classList.remove("error-message");
      return;
    }

    $("pageMessage").textContent = "";
    $("pageMessage").classList.remove("error-message");

    $("seriesHeading").classList.remove("hidden");

    for (let index = 0; index < episodes.length; index++) {
      const episode = episodes[index];
      const row = document.createElement("div");
      row.className = "episode-link-item";

      const link = document.createElement("a");
      link.href = makeEpisodeUrl(episode.id);

      const title = document.createElement("span");
      title.textContent = episode.title || "タイトル未設定";

      link.appendChild(title);
      row.appendChild(link);
      $("episodeList").appendChild(row);
    }

    $("episodeList").classList.remove("hidden");
  }


  function renderEpisode(series, episodes, index) {
    const episode = episodes[index];

    $("pageMessage").textContent = "";
    $("pageMessage").classList.remove("error-message");
    $("episodeList").classList.add("hidden");

    // 本文ページではシリーズタイトルを非表示
    $("seriesHeading").classList.add("hidden");

    $("episodeTitle").textContent = episode.title || "タイトル未設定";

    renderContent(episode.content || "");

    $("episodeView").classList.remove("hidden");

    const nav = $("episodeNavigation");
    nav.replaceChildren();

    if (index > 0) {
      const previous = document.createElement("a");
      previous.className = "square-link";
      previous.href = makeEpisodeUrl(episodes[index - 1].id);
      previous.textContent = "前の話";
      nav.appendChild(previous);
    } else {
      const spacer = document.createElement("span");
      nav.appendChild(spacer);
    }

    const listLink = document.createElement("a");
    listLink.className = "square-link";
    listLink.href = makeEpisodeUrl();
    listLink.textContent = "話一覧";
    nav.appendChild(listLink);

    if (index < episodes.length - 1) {
      const next = document.createElement("a");
      next.className = "square-link";
      next.href = makeEpisodeUrl(episodes[index + 1].id);
      next.textContent = "次の話";
      nav.appendChild(next);
    }
  }


  async function loadStory() {
    if (!seriesId) {
      showError("シリーズが指定されていません。小説一覧からシリーズを選んでください。");
      return;
    }

    try {
      const response = await fetch(`${DATA_URL}?v=${Date.now()}`, {
        cache:"no-store"
      });

      if (!response.ok) {
        throw new Error(`小説データを読み込めませんでした（HTTP ${response.status}）。`);
      }

      const data = await response.json();

      if (!data || !Array.isArray(data.series)) {
        throw new Error("小説データの形式を確認できませんでした。");
      }

      const series = data.series.find(item => String(item.id) === seriesId);

      if (!series) {
        showError("シリーズが見つかりません。小説一覧から選び直してください。");
        return;
      }

      const episodes = Array.isArray(series.episodes) ? [...series.episodes] : [];

      episodes.sort((a, b) =>
        (Number(a.order) || 0) - (Number(b.order) || 0)
      );

      window.currentSeries = series;
      window.currentEpisodes = episodes;

      $("seriesHeading").textContent = series.title || "novel";
      document.title = `${series.title || "novel"} | novel`;

      $("pageMessage").textContent = "";

      if (episodeId) {
        const index = episodes.findIndex(item => String(item.id) === episodeId);

        if (index < 0) {
          showError("話が見つかりません。話一覧から選び直してください。");
          return;
        }

        renderEpisode(series, episodes, index);
      } else {
        renderEpisodeList(series, episodes);
      }

    } catch (error) {
      showError(error.message || "小説データを読み込めませんでした。");
    }
  }

  loadStory();
</script>
</body>
</html>
