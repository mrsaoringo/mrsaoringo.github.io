<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>murmur admin</title>

<style>

@charset "UTF-8";

/* Template & Designed by Towako. */
/* https://ninawas.me */

/* ウェブフォントの読み込み */
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Unica+One&display=swap');


/* ====================================
   全体に適用する
==================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-weight: normal;
    font-family: 'Kosugi Maru', sans-serif;
}


/* ====================================
   基本設定
==================================== */

body {
    background-color: #fff;
    text-align: center;
    line-height: 1.7;
    letter-spacing: 0.1em;
    font-size: 13px;
    color: #888;
}


/* ====================================
   リンク
==================================== */

a {
    color: #888;
}


/* ====================================
   セクション
==================================== */

section {
    padding: 3em;
    text-align: justify;
    word-break: break-all;
}


/* ====================================
   タイトル
==================================== */

section h2 {
    text-align: center;
    font-family: 'Unica One', cursive;
    font-size: 2em;
    letter-spacing: 0.15em;
    color: #888;
    margin-bottom: 2em;
}


/* ====================================
   フォーム
==================================== */

.admin-form {
    width: 100%;
    max-width: 425px;
    margin: 0 auto;
    text-align: left;
}


/* ラベル */

.admin-form label {
    display: block;
    margin-top: 0.8em;
    margin-bottom: 0.2em;
    color: #888;
    font-size: 0.9em;
}


/* 入力欄・種類・本文 */

.admin-form input,
.admin-form select,
.admin-form textarea {
    display: block;
    width: 100%;
    -webkit-appearance: none;
    padding: 0.5em 0.7em;
    background-color: #999;
    border: none;
    border-radius: 0;
    border-bottom-right-radius: 20px;
    color: #fff;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 0.9em;
    letter-spacing: 0.1em;
    outline: none;
}


/* 入力欄 */

.admin-form input,
.admin-form select {
    height: 40px;
}


/* 日付 */

.admin-form input[type="date"] {
    width: 210px;
}


/* 本文 */

.admin-form textarea {
    height: 150px;
    resize: vertical;
}


/* プレースホルダー */

.admin-form input::placeholder,
.admin-form textarea::placeholder {
    color: #fff;
    opacity: 1;
}


/* ====================================
   投稿ボタン
==================================== */

.admin-form button {
    margin-top: 1em;
    padding: 0.5em 1.5em;
    background-color: #999;
    border: none;
    border-bottom-right-radius: 20px;
    color: #fff;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 0.9em;
    letter-spacing: 0.1em;
    cursor: pointer;
}

.admin-form button:hover {
    opacity: 0.8;
}


/* 投稿結果 */

.message {
    margin-top: 1.5em;
    text-align: center;
}


/* ====================================
   murmurへ戻る
   TOPへ戻ると同じサイズ
==================================== */

.back {
    margin-top: 1em;
    text-align: center;
}

.back a {
    display: inline-block;
    padding: 0.5em 1.5em;
    background-color: #999;
    border: none;
    color: #fff;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 0.9em;
    letter-spacing: 0.1em;
    text-decoration: none;
}

.back a:hover {
    opacity: 0.8;
}


/* ====================================
   横幅768px以上
==================================== */

@media screen and (min-width: 768px) {

    body {
        font-size: 14px;
    }

}


/* ====================================
   スマートフォン用
==================================== */

@media screen and (max-width: 767px) {

    section {
        padding: 3em 2em;
    }

    .admin-form input[type="date"] {
        width: 210px;
        max-width: 100%;
    }

}

</style>
</head>


<body>

<section>

<h2>murmur admin</h2>


<form class="admin-form" id="murmurForm">


    <!-- 管理キー -->

    <label for="adminKey">
        管理キー
    </label>

    <input
        type="password"
        id="adminKey"
        placeholder="管理キーを入力"
        required
    >


    <!-- 日付 -->

    <label for="date">
        日付
    </label>

    <input
        type="date"
        id="date"
        required
    >


    <!-- 種類 -->

    <label for="type">
        種類
    </label>

    <select
        id="type"
        required
    >

        <option value="murmur">
            murmur
        </option>

        <option value="UP">
            UP
        </option>

    </select>


    <!-- 本文 -->

    <label for="text">
        本文
    </label>

    <textarea
        id="text"
        placeholder="ここに入力"
        required
    ></textarea>


    <!-- 投稿 -->

    <button type="submit">
        投稿する
    </button>


    <div
        class="message"
        id="message">
    </div>


</form>


<!-- murmurへ戻る -->

<div class="back">

    <a href="murmur.html">
        murmurへ戻る
    </a>

</div>


</section>


<script>

const WORKER_URL =
    "https://murmur-post.melodic-ars.workers.dev";


const form =
    document.getElementById("murmurForm");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.textContent =
            "投稿中…";


        const adminKey =
            document.getElementById(
                "adminKey"
            ).value;


        const date =
            document.getElementById(
                "date"
            ).value;


        const type =
            document.getElementById(
                "type"
            ).value;


        const text =
            document.getElementById(
                "text"
            ).value;


        try {

            const response =
                await fetch(
                    WORKER_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            adminKey:
                                adminKey,

                            date:
                                date,

                            type:
                                type,

                            text:
                                text

                        })

                    }
                );


            const result =
                await response.json();


            if (result.success) {

                message.textContent =
                    "投稿しました！";

                document.getElementById(
                    "text"
                ).value = "";

            } else {

                message.textContent =
                    result.message ||
                    "投稿に失敗しました。";

            }


        } catch (error) {

            message.textContent =
                "通信エラーが発生しました。";

        }

    }
);

</script>

</body>
</html>
