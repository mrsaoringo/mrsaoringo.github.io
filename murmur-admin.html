<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>murmur admin</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Unica+One&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #fff;
    color: #888;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 13px;
}

section {
    padding: 3em;
}

h2 {
    margin: 0 0 2em;
    text-align: center;
    font-family: 'Unica One', sans-serif;
    font-size: 1.5em;
    font-weight: bold;
    color: #888;
}

.admin-form {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}

.admin-form label {
    display: block;
    margin: 1.5em 0 0.5em;
}

.admin-form input,
.admin-form select,
.admin-form textarea {
    width: 100%;
    padding: 0.7em 1em;
    background-color: #999;
    border: none;
    border-bottom-right-radius: 20px;
    color: #fff;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 0.9em;
}

.admin-form input::placeholder,
.admin-form textarea::placeholder {
    color: #eee;
}

.admin-form input:focus,
.admin-form select:focus,
.admin-form textarea:focus {
    outline: none;
}

.admin-form input[type="date"] {
    width: 220px;
}

.admin-form textarea {
    height: 200px;
    resize: vertical;
}

/* 投稿するボタン */

.admin-form button {
    display: block;
    margin: 2em 0 0;
    padding: 0.7em 2em;
    background-color: #999;
    border: none;
    border-bottom-right-radius: 20px;
    color: #fff;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 1em;
    letter-spacing: 0.1em;
    cursor: pointer;
}

.admin-form button:hover {
    opacity: 0.8;
}

.message {
    margin-top: 1.5em;
    text-align: center;
}

/* murmurへ戻る */

.back {
    margin-top: 3em;
    text-align: center;
}

.back a {
    display: inline-block;
    padding: 0 0.5em;
    background-color: #999;
    color: #fff;
    text-decoration: none;
}

.back a:hover {
    opacity: 0.8;
}

@media screen and (max-width: 600px) {

    section {
        padding: 3em 2em;
    }

    .admin-form input[type="date"] {
        width: 100%;
    }

}

</style>
</head>


<body>

<section>

<h2>murmur admin</h2>

<form class="admin-form" id="murmurForm">

    <label for="adminKey">管理キー</label>

    <input
        type="password"
        id="adminKey"
        placeholder="管理キーを入力"
        required
    >


    <label for="date">日付</label>

    <input
        type="date"
        id="date"
        required
    >


    <label for="type">種類</label>

    <select id="type" required>

        <option value="murmur">murmur</option>
        <option value="UP">UP</option>

    </select>


    <label for="text">本文</label>

    <textarea
        id="text"
        placeholder="ここに入力"
        required
    ></textarea>


    <button type="submit">投稿する</button>

    <div class="message" id="message"></div>

</form>


<div class="back">
    <a href="murmur.html">murmurへ戻る</a>
</div>

</section>


<script>

const WORKER_URL =
    "https://murmur-post.melodic-ars.workers.dev";


const form =
    document.getElementById("murmurForm");


const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "投稿中…";


    const adminKey =
        document.getElementById("adminKey").value;

    const date =
        document.getElementById("date").value;

    const type =
        document.getElementById("type").value;

    const text =
        document.getElementById("text").value;


    try {

        const response = await fetch(WORKER_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                adminKey: adminKey,
                date: date,
                type: type,
                text: text

            })

        });


        const result =
            await response.json();


        if (result.success) {

            message.textContent =
                "投稿しました！";

            document.getElementById("text").value = "";

        } else {

            message.textContent =
                result.message ||
                "投稿に失敗しました。";

        }


    } catch (error) {

        message.textContent =
            "通信エラーが発生しました。";

    }

});

</script>

</body>

</html>
