
<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9e4ee">
<title>STORY | green or blue?</title>

<style>
@charset "UTF-8";

/* Template & Designed by Towako. */
/* https://ninawas.me */

/* ウェブフォントの読み込み */
@import url('https://fonts.googleapis.com/css?family=Noto+Serif+JP&display=swap');

@font-face {
    font-family: 'XANO明朝';
    font-display: swap;
    src: url('https://cdn.leafscape.be/XANO-mincho/XANO-mincho_web.woff2') format("woff2");

/* 全体に適用する */

    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-weight: normal;
    font-family: 'Noto Serif JP', serif;

    background-color: #d9e4ee;

    text-decoration: none;

    color: #000;

/* 訪問済みリンク */

/* 背景画像 */

    position: fixed;

/* ヘッダーとセクション */

}

/* ヘッダー見出し */

    padding-left: 0.5em;
    border-left: 5px solid #176cb5;
    line-height: 1.3;
    font-family: 'XANO明朝', serif;
    font-size: 1.2em;
    color: #176cb5;
}

/* 補足情報 */

    margin-top: 1em;
    width: 65%;
    font-size: 11px;
    color: #606060;
}

/* リスト系 */

    list-style-position: inside;
    list-style-type: decimal-leading-zero;
}

    list-style-type: none;
}

section li {

}

/* セクションリンク */
section a {
    padding: 0;
    border-bottom: thin solid #9bc4e5;
    background-color: transparent;
}

/* 段落 */

    font-size: 11px;
    color: #606060;

/* アーティクル見出し */

<body>

<div id="bg"></div>

<header>
    <h1 id="seriesTitle">タイトル</h1>
    <aside id="seriesDescription">作品情報を読み込み中…</aside>
</header>

<section>
    <ol id="episodeList"></ol>
    <p id="pageMessage" class="message"></p>
</section>

<footer>
    [Template] <a href="https://ninawas.me" target="_blank" rel="noopener">Nina</a>
    <br>
    <a href="index.html">BACK TO TOP</a>
</footer>

<script>
const DATA_URL = "./novel-data.json";

const params = new URLSearchParams(location.search);
const seriesId = params.get("seriesId");

const $ = id => document.getElementById(id);

async function loadStory() {

    const message = $("pageMessage");

    if (!seriesId) {
        message.textContent = "作品が指定されていません。";
        $("seriesDescription").textContent = "";
        return;
    }

    try {

        const response = await fetch(DATA_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("作品データを読み込めませんでした。");
        }

        const data = await response.json();

        if (!data || !Array.isArray(data.series)) {
            throw new Error("作品データの形式を確認できませんでした。");
        }

        const series = data.series.find(item =>
            String(item.id) === String(seriesId)
        );

        if (!series) {
            throw new Error("作品が見つかりませんでした。");
        }

        document.title = `${series.title || "STORY"} | green or blue?`;

        $("seriesTitle").textContent =
            series.title || "タイトル未設定";

        $("seriesDescription").textContent =
            series.synopsis || "";

        const episodes = Array.isArray(series.episodes)
            ? series.episodes
            : [];

        const list = $("episodeList");

        list.replaceChildren();

        if (episodes.length === 0) {
            message.textContent = "公開中のお話はまだありません。";
            return;
        }

        episodes.forEach((episode, index) => {

            const li = document.createElement("li");
            const link = document.createElement("a");

            link.textContent =
                episode.title || `第${index + 1}話`;

            link.href =
                `novel-page.html?seriesId=${encodeURIComponent(series.id)}&episodeIndex=${index}`;

            li.appendChild(link);
            list.appendChild(li);

        });

        message.textContent = "";

    } catch (error) {

        $("seriesDescription").textContent = "";
        message.textContent =
            error.message || "読み込みに失敗しました。";

    }

}

loadStory();
</script>

</body>
</html>
