<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* murmur のサイトデザインに合わせた小説一覧 */
    body { width:100%; color:#888; }
    body > section {
      display:block;
      width:100%;
      max-width:none;
      margin-left:auto !important;
      margin-right:auto !important;
      padding:0 1.5em;
      box-sizing:border-box;
    }
    section h2 { margin-top:2em; text-align:center; }
    .series-list {
      width:100%;
      max-width:600px;
      margin:0 auto;
      text-align:left;
    }
    .series-item {
      padding:1.2em 0;
      border-bottom:1px solid #ddd;
    }
    .series-item h3 {
      margin:0 0 .6em;
      color:#888;
      font-size:1.1em;
      font-weight:400;
      line-height:1.8;
    }
    .series-meta {
      display:flex;
      flex-wrap:wrap;
      gap:.7em;
      margin-bottom:.6em;
      color:#888;
      font-size:.85em;
    }
    .series-synopsis {
      margin:.6em 0 0;
      color:#888;
      line-height:1.8;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .read-link {
      display:inline-block;
      margin-top:.8em;
      padding:.5em 1.2em;
      background-color:#999;
      border-bottom-right-radius:20px;
      color:#fff;
      font-family:'Kosugi Maru',sans-serif;
      font-size:.9em;
      letter-spacing:.1em;
      text-decoration:none;
    }
    .read-link:hover { opacity:.8; }
    .read-link[aria-disabled="true"] {
      background-color:#bbb;
      cursor:default;
    }
    .empty-message, .page-message {
      padding:2em 0;
      color:#888;
      text-align:center;
      line-height:1.8;
    }
    .error-message { color:#b66; }
    .back { margin-top:3em; text-align:center; }
    .back a {
      display:inline-block;
      padding:.5em 1.2em;
      background-color:#999;
      border-bottom-right-radius:20px;
      color:#fff;
      text-decoration:none;
    }
    .back a:hover { opacity:.8; }
  </style>
</head>
<body>
<section>
  <h2>main</h2>

  <p id="pageMessage" class="page-message">シリーズを読み込み中…</p>
  <div id="seriesList" class="series-list" aria-live="polite"></div>

  <div class="back">
    <a href="index.html">TOPへ戻る</a>
  </div>
</section>

<script>
  const DATA_URL = "./novel-data.json";
  const seriesList = document.getElementById("seriesList");
  const pageMessage = document.getElementById("pageMessage");

  const categoryNames = {
    long: "長編",
    middle: "中編",
    short: "短編"
  };

  function showError(text) {
    pageMessage.textContent = text;
    pageMessage.classList.add("error-message");
  }

  function renderSeries(seriesItems) {
    seriesList.replaceChildren();

    if (seriesItems.length === 0) {
      pageMessage.textContent = "公開中のシリーズはまだありません。";
      pageMessage.classList.remove("error-message");
      return;
    }

    pageMessage.textContent = "";
    pageMessage.classList.remove("error-message");

    for (const series of seriesItems) {
      const item = document.createElement("article");
      item.className = "series-item";

      const title = document.createElement("h3");
      title.textContent = series.title || "タイトル未設定";

      const meta = document.createElement("div");
      meta.className = "series-meta";

      const category = document.createElement("span");
      category.textContent = categoryNames[series.category] || "";

      const episodeCount = document.createElement("span");
      const episodes = Array.isArray(series.episodes) ? series.episodes : [];
      episodeCount.textContent = `全${episodes.length}話`;
      meta.append(category, episodeCount);

      const synopsis = document.createElement("p");
      synopsis.className = "series-synopsis";
      synopsis.textContent = series.synopsis || "あらすじはありません。";

      const readLink = document.createElement("a");
      readLink.className = "read-link";
      readLink.textContent = episodes.length ? "シリーズを読む" : "話は準備中です";

      if (episodes.length > 0 && series.id) {
        readLink.href = `novel-story.html?seriesId=${encodeURIComponent(series.id)}`;
      } else {
        readLink.setAttribute("aria-disabled", "true");
        readLink.setAttribute("tabindex", "-1");
      }

      item.append(title, meta, synopsis, readLink);
      seriesList.appendChild(item);
    }
  }

  async function loadSeries() {
    try {
      const response = await fetch(DATA_URL, { cache:"no-store" });
      if (!response.ok) {
        throw new Error(`小説データを読み込めませんでした（HTTP ${response.status}）。`);
      }

      const data = await response.json();
      if (!data || !Array.isArray(data.series)) {
        throw new Error("小説データの形式を確認できませんでした。");
      }

      renderSeries(data.series);
    } catch (error) {
      seriesList.replaceChildren();
      showError(error.message || "小説データを読み込めませんでした。");
    }
  }

  loadSeries();
</script>
</body>
</html>
