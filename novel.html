<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* murmur のサイトデザインに合わせた小説一覧 */
    body { width:100%; color:#888; }
    body > section {
      display:block;
      width:100%;
      max-width:none;
      margin-left:auto !important;
      margin-right:auto !important;
      padding-left:1.5em;
      padding-right:1.5em;
      box-sizing:border-box;
    }
    /* 見出し位置・指定はmurmur.htmlに合わせる */
    .series-list {
      width:100%;
      max-width:600px;
      margin:0 auto;
      text-align:left;
    }
    .series-item {
      padding:1.2em 0;
      border-bottom:1px solid #ddd;
    }
    .series-item h3 {
      margin:0 0 .6em;
      color:#888;
      font-family:inherit;
      font-size:1em;
      font-weight:400;
      line-height:1.8;
      letter-spacing:inherit;
    }
    .series-item h3,
    .series-item h3::after {
      border:0 !important;
      text-decoration:none !important;
    }
    .series-item h3::after {
      content:none !important;
      display:none !important;
      width:0 !important;
      margin:0 !important;
    }
    .series-meta {
      display:flex;
      flex-wrap:wrap;
      gap:.7em;
      margin-bottom:.6em;
      color:#888;
      font-size:.85em;
    }
    .series-synopsis {
      margin:.6em 0 0;
      color:#888;
      line-height:1.8;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .read-link {
      display:inline-block;
      margin-top:.8em;
      padding:.5em 1.2em;
      background-color:#999;
      border-radius:0;
      color:#fff;
      font-family:'Kosugi Maru',sans-serif;
      font-size:.9em;
      letter-spacing:.1em;
      text-decoration:none;
    }
    .read-link:hover { opacity:.8; }
    .read-link[aria-disabled="true"] {
      background-color:#bbb;
      cursor:default;
    }
    .empty-message, .page-message {
      padding:2em 0;
      color:#888;
      text-align:center;
      line-height:1.8;
    }
    .error-message { color:#b66; }
    .reader-name-form { max-width:425px; margin:0 auto .5em; text-align:left; }
    .reader-name-form h3 { margin:0 0 .8em; color:#888; font-size:1em; font-weight:400; }
    .reader-name-fields { display:flex; gap:1em; flex-wrap:wrap; }
    .reader-name-fields label { display:block; flex:1 1 140px; color:#888; font-size:.9em; }
    .reader-name-fields input {
      display:block; width:100%; height:40px; margin-top:.3em; padding:.5em .7em;
      border:0; border-radius:0; border-bottom-right-radius:20px; box-sizing:border-box;
      background:#999; color:#fff !important; -webkit-text-fill-color:#fff; caret-color:#fff;
      font:inherit; font-size:.9em; letter-spacing:.1em;
    }
    .reader-name-fields input::placeholder { color:#fff; opacity:1; }
    .reader-name-form button {
      margin-top:1em; padding:.5em 1.2em; border:0; border-radius:0;
      background:#999; color:#fff; font:inherit; font-size:.9em; letter-spacing:.1em; cursor:pointer;
    }
    .reader-name-form button:hover { opacity:.8; }
    .reader-name-message { margin:.3em 0 0; color:#698b75; font-size:.85em; }
    #readerNameMessage:empty, #pageMessage:empty { display:none; }
    .back { margin-top:3em; text-align:center; }
    .back a {
      display:inline-block;
      padding:.5em 1.2em;
      background-color:#999;
      border-radius:0;
      color:#fff;
      text-decoration:none;
    }
    .back a:hover { opacity:.8; }
  </style>
</head>
<body>
<section>
  <h2 style="text-align: center;">main</h2>

  <form id="readerNameForm" class="reader-name-form">
    <h3>name change</h3>
    <div class="reader-name-fields">
      <label for="readerSurname">
        <input type="text" id="readerSurname" autocomplete="family-name" placeholder="苗字">
      </label>
      <label for="readerName">
        <input type="text" id="readerName" autocomplete="given-name" placeholder="名前">
      </label>
    </div>
    <button type="submit">変更</button>
    <p id="readerNameMessage" class="reader-name-message" aria-live="polite"></p>
  </form>

  <br>

  <p id="pageMessage" class="page-message">シリーズを読み込み中…</p>
  <div id="seriesList" class="series-list" aria-live="polite"></div>

  <div class="back">
    <a href="index.html">TOPへ戻る</a>
  </div>
</section>

<script>
  const DATA_URL = "./novel-data.json";
  const $ = id => document.getElementById(id);
  const seriesList = document.getElementById("seriesList");
  const pageMessage = document.getElementById("pageMessage");

  $("readerSurname").value = localStorage.getItem("novelSurname") || "";
  $("readerName").value = localStorage.getItem("novelName") || "";

  $("readerNameForm").addEventListener("submit", event => {
    event.preventDefault();
    localStorage.setItem("novelSurname", $("readerSurname").value);
    localStorage.setItem("novelName", $("readerName").value);
    $("readerNameMessage").textContent = "名前を保存しました。";
  });

  const categoryNames = {
    long: "長編",
    middle: "中編",
    short: "短編"
  };

  function showError(text) {
    pageMessage.textContent = text;
    pageMessage.classList.add("error-message");
  }

  function renderSeries(seriesItems) {
    seriesList.replaceChildren();

    if (seriesItems.length === 0) {
      pageMessage.textContent = "公開中のシリーズはまだありません。";
      pageMessage.classList.remove("error-message");
      return;
    }

    pageMessage.textContent = "";
    pageMessage.classList.remove("error-message");

    for (const series of seriesItems) {
      const item = document.createElement("article");
      item.className = "series-item";

      const title = document.createElement("h3");
      title.textContent = series.title || "タイトル未設定";

      const meta = document.createElement("div");
      meta.className = "series-meta";

      const category = document.createElement("span");
      category.textContent = categoryNames[series.category] || "";

      const episodeCount = document.createElement("span");
      const episodes = Array.isArray(series.episodes) ? series.episodes : [];
      episodeCount.textContent = `全${episodes.length}話`;
      meta.append(category, episodeCount);

      const synopsis = document.createElement("p");
      synopsis.className = "series-synopsis";
      synopsis.textContent = series.synopsis || "あらすじはありません。";

      const readLink = document.createElement("a");
      readLink.className = "read-link";
      readLink.textContent = episodes.length ? "シリーズを読む" : "話は準備中です";

      if (episodes.length > 0 && series.id) {
        readLink.href = `novel-story.html?seriesId=${encodeURIComponent(series.id)}`;
      } else {
        readLink.setAttribute("aria-disabled", "true");
        readLink.setAttribute("tabindex", "-1");
      }

      item.append(title, meta, synopsis, readLink);
      seriesList.appendChild(item);
    }
  }

  async function loadSeries() {
    try {
      const response = await fetch(DATA_URL, { cache:"no-store" });
      if (!response.ok) {
        throw new Error(`小説データを読み込めませんでした（HTTP ${response.status}）。`);
      }

      const data = await response.json();
      if (!data || !Array.isArray(data.series)) {
        throw new Error("小説データの形式を確認できませんでした。");
      }

      renderSeries(data.series);
    } catch (error) {
      seriesList.replaceChildren();
      showError(error.message || "小説データを読み込めませんでした。");
    }
  }

  loadSeries();
</script>
</body>
</html>
