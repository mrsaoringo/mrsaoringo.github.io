
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>novel admin</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* murmur admin に合わせたレイアウト */
    body {
      background: #fff;
      color: #888;
      font-family: "Kosugi Maru", sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    body main {
      width: 100%;
      padding: 8em 1.5em 3em;
      box-sizing: border-box;
    }

    body main > section {
      display: block;
      width: 100%;
      max-width: 456px;
      margin: 0 auto;
      padding: 0;
      box-sizing: border-box;
    }

    body main > section > h2 {
      display: block;
      width: 100%;
      margin: 0 0 5em;
      padding: 0;
      color: #888;
      text-align: center !important;
      font-family: "Unica One", sans-serif;
      font-size: 28px;
      font-weight: 400 !important;
      line-height: 1.4;
      letter-spacing: 0.2em;
    }

    h3 {
      margin: 3em 0 1em;
      padding: 0;
      color: #888;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.1em;
    }

    h3::after {
      content: "";
      display: block;
      width: 32px;
      margin-top: 0.7em;
      border-bottom: 3px solid #999;
    }

    p {
      line-height: 1.9;
    }

    .admin-form {
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .admin-form label {
      display: block;
      margin: 1em 0 0.5em;
      color: #888;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.8em;
      border: none;
      border-radius: 0;
      background: #999;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    input::placeholder,
    textarea::placeholder {
      color: #eee;
    }

    select {
      cursor: pointer;
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      line-height: 1.8;
    }

    button {
      padding: 0.7em 1.3em;
      border: none;
      border-radius: 0;
      background: #999;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.75;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .submit-area {
      margin-top: 1em;
      text-align: left;
    }

    .admin-divider {
      display: block;
      width: 100%;
      margin: 3em auto;
      border: none;
      border-top: 1px solid #ccc;
      box-sizing: border-box;
    }

    .message {
      margin: 1em 0;
      line-height: 1.8;
    }

    .error {
      color: #b66;
    }

    .success {
      color: #698b75;
    }

    .series-card,
    .episode-card {
      margin: 1.5em 0;
      padding: 1.2em;
      border: 1px solid #ccc;
      background: #fff;
    }

    .series-card h4,
    .episode-card h4 {
      margin: 0 0 0.8em;
      color: #777;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.8;
    }

    .card-info {
      margin: 0.5em 0;
      color: #999;
      font-size: 12px;
      line-height: 1.8;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6em;
      margin-top: 1em;
    }

    .card-actions button {
      padding: 0.6em 1em;
      font-size: 12px;
    }

    .delete-button {
      background: #b88c8c;
    }

    .hint {
      margin-top: 0.6em;
      color: #aaa;
      font-size: 11px;
      line-height: 1.8;
    }

    .count {
      margin-top: 0.5em;
      text-align: right;
      color: #aaa;
      font-size: 11px;
    }

    .episode-order {
      color: #aaa;
      margin-right: 0.5em;
    }

    .hidden {
      display: none !important;
    }

    .back {
      margin-top: 3em;
      text-align: center;
    }

    .back a {
      display: inline-block;
      padding: 0.7em 1.5em;
      background: #999;
      color: #fff;
      text-decoration: none;
      border-radius: 0;
    }

    .back a:hover {
      opacity: 0.75;
    }

    @media (max-width: 600px) {
      body main {
        padding: 5em 1.5em 3em;
      }

      body main > section > h2 {
        margin-bottom: 4em;
      }
    }
  </style>
</head>

<body>
<main>
<section>

  <h2>novel admin</h2>

  <!-- ログイン -->
  <div id="loginArea">
    <form id="loginForm" class="admin-form">
      <label for="adminKey">管理キー</label>
      <input
        type="password"
        id="adminKey"
        placeholder="管理キーを入力"
        autocomplete="current-password"
        required
      >
      <div class="submit-area">
        <button type="submit">管理画面を開く</button>
      </div>
    </form>
    <p id="loginMessage" class="message"></p>
  </div>

  <!-- 管理画面 -->
  <div id="adminArea" class="hidden">

    <h3>NAME CHANGE</h3>
    <div class="admin-form">
      <p>小説内で使用する名前を設定できます。</p>

      <label for="surnameInput">姓</label>
      <input type="text" id="surnameInput" placeholder="姓を入力">

      <label for="nameInput">名</label>
      <input type="text" id="nameInput" placeholder="名を入力">

      <p class="hint">
        本文中の {surname} と {name} が設定した名前に置き換わります。
      </p>

      <div class="submit-area">
        <button type="button" id="saveNameButton">名前を保存</button>
      </div>
      <p id="nameMessage" class="message"></p>
    </div>

    <hr class="admin-divider">

    <!-- シリーズ作成 -->
    <h3 id="seriesFormHeading">新規シリーズ</h3>

    <form id="seriesForm" class="admin-form">
      <label for="seriesTitle">シリーズ名</label>
      <input type="text" id="seriesTitle" placeholder="シリーズ名" required>

      <label for="seriesCategory">種類</label>
      <select id="seriesCategory">
        <option value="long">長編</option>
        <option value="middle">中編</option>
        <option value="short">短編</option>
      </select>

      <label for="seriesSynopsis">あらすじ</label>
      <textarea id="seriesSynopsis" placeholder="あらすじを入力" rows="5"></textarea>

      <div class="submit-area">
        <button type="submit" id="seriesSubmitButton">シリーズを作成</button>
        <button type="button" id="cancelSeriesEdit" class="hidden">キャンセル</button>
      </div>
      <p id="seriesMessage" class="message"></p>
    </form>

    <hr class="admin-divider">

    <!-- シリーズ一覧 -->
    <h3>SERIES LIST</h3>
    <div id="seriesList">
      <p class="message">シリーズはまだありません。</p>
    </div>

    <hr class="admin-divider">

    <!-- エピソード作成 -->
    <h3 id="episodeFormHeading">新規エピソード</h3>

    <form id="episodeForm" class="admin-form">
      <label for="episodeSeries">投稿先シリーズ</label>
      <select id="episodeSeries" required>
        <option value="">シリーズを選択</option>
      </select>

      <label for="episodeTitle">エピソード名</label>
      <input type="text" id="episodeTitle" placeholder="エピソード名" required>

      <label for="episodeContent">本文</label>
      <textarea
        id="episodeContent"
        placeholder="小説本文を入力"
        rows="20"
        required
      ></textarea>
      <div class="count" id="characterCount">0文字</div>

      <div class="submit-area">
        <button type="submit" id="episodeSubmitButton">エピソードを追加</button>
        <button type="button" id="cancelEpisodeEdit" class="hidden">キャンセル</button>
      </div>
      <p id="episodeMessage" class="message"></p>
    </form>

    <hr class="admin-divider">

    <!-- エピソード一覧 -->
    <h3>EPISODE LIST</h3>

    <label for="episodeListSeries">シリーズを選択</label>
    <select id="episodeListSeries">
      <option value="">シリーズを選択</option>
    </select>

    <div id="episodeList">
      <p class="message">シリーズを選択してください。</p>
    </div>

    <hr class="admin-divider">

    <div class="submit-area">
      <button type="button" id="logoutButton">ログアウト</button>
    </div>
  </div>

  <div class="back">
    <a href="novel.html">BACK TO NOVEL</a>
  </div>

  <div class="back">
    <a href="index.html">TOPへ戻る</a>
  </div>

</section>
</main>

<script>
  // Cloudflare Workers のURLに変更してください
  const WORKER_URL = "https://novel-post.あなたのサブドメイン.workers.dev";

  let adminKey = "";
  let novelData = { series: [] };
  let editingSeriesId = null;
  let editingEpisodeId = null;

  const $ = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  function message(id, text, type = "") {
    $(id).textContent = text;
    $(id).className = "message " + type;
  }

  async function api(action, params = {}) {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, adminKey, ...params })
    });

    const result = await response.json();

    if (!response.ok || result.success === false) {
      throw new Error(result.message || "通信に失敗しました。");
    }

    return result;
  }

  // ログイン
  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    adminKey = $("adminKey").value.trim();

    try {
      await loadData();
      sessionStorage.setItem("novelAdminKey", adminKey);
      $("loginArea").classList.add("hidden");
      $("adminArea").classList.remove("hidden");
      loadNameSettings();
    } catch (error) {
      adminKey = "";
      message("loginMessage", error.message, "error");
    }
  });

  // データ読み込み
  async function loadData() {
    const result = await api("list");
    novelData = result.data || { series: [] };
    if (!Array.isArray(novelData.series)) novelData.series = [];

    renderSeries();
    updateSeriesSelects();
  }

  // シリーズ一覧
  function renderSeries() {
    const list = $("seriesList");

    if (!novelData.series.length) {
      list.innerHTML = '<p class="message">シリーズはまだありません。</p>';
      return;
    }

    const categoryNames = {
      long: "長編",
      middle: "中編",
      short: "短編"
    };

    list.innerHTML = novelData.series.map(series => `
      <div class="series-card">
        <h4>${escapeHTML(series.title)}</h4>
        <p class="card-info">種類：${escapeHTML(categoryNames[series.category] || "")}</p>
        <p class="card-info">エピソード数：${(series.episodes || []).length}</p>
        <p class="card-info">${escapeHTML(series.synopsis || "あらすじ未設定")}</p>
        <div class="card-actions">
          <button type="button" onclick="editSeries('${escapeHTML(series.id)}')">編集</button>
          <button type="button" class="delete-button" onclick="deleteSeries('${escapeHTML(series.id)}')">削除</button>
        </div>
      </div>
    `).join("");
  }

  // シリーズ選択欄
  function updateSeriesSelects() {
    const options = novelData.series.map(series =>
      `<option value="${escapeHTML(series.id)}">${escapeHTML(series.title)}</option>`
    ).join("");

    const episodeSelect = $("episodeSeries");
    const listSelect = $("episodeListSeries");

    const oldEpisode = episodeSelect.value;
    const oldList = listSelect.value;

    episodeSelect.innerHTML = '<option value="">シリーズを選択</option>' + options;
    listSelect.innerHTML = '<option value="">シリーズを選択</option>' + options;

    if (novelData.series.some(s => s.id === oldEpisode)) {
      episodeSelect.value = oldEpisode;
    }
    if (novelData.series.some(s => s.id === oldList)) {
      listSelect.value = oldList;
    }
  }

  // シリーズ作成・編集
  $("seriesForm").addEventListener("submit", async event => {
    event.preventDefault();

    const params = {
      title: $("seriesTitle").value.trim(),
      category: $("seriesCategory").value,
      synopsis: $("seriesSynopsis").value.trim()
    };

    try {
      if (editingSeriesId) {
        await api("updateSeries", { seriesId: editingSeriesId, ...params });
        message("seriesMessage", "シリーズを更新しました。", "success");
      } else {
        await api("createSeries", params);
        message("seriesMessage", "シリーズを作成しました。", "success");
      }

      resetSeriesForm();
      await loadData();
    } catch (error) {
      message("seriesMessage", error.message, "error");
    }
  });

  window.editSeries = id => {
    const series = novelData.series.find(s => s.id === id);
    if (!series) return;

    editingSeriesId = id;
    $("seriesTitle").value = series.title || "";
    $("seriesCategory").value = series.category || "long";
    $("seriesSynopsis").value = series.synopsis || "";
    $("seriesFormHeading").textContent = "シリーズ編集";
    $("seriesSubmitButton").textContent = "更新する";
    $("cancelSeriesEdit").classList.remove("hidden");
    $("seriesForm").scrollIntoView({ behavior: "smooth" });
  };

  function resetSeriesForm() {
    editingSeriesId = null;
    $("seriesForm").reset();
    $("seriesFormHeading").textContent = "新規シリーズ";
    $("seriesSubmitButton").textContent = "シリーズを作成";
    $("cancelSeriesEdit").classList.add("hidden");
  }

  $("cancelSeriesEdit").addEventListener("click", resetSeriesForm);

  window.deleteSeries = async id => {
    const series = novelData.series.find(s => s.id === id);
    if (!series) return;

    if (!confirm(`「${series.title}」とそのエピソードを削除しますか？`)) return;

    try {
      await api("deleteSeries", { seriesId: id });
      await loadData();
      message("seriesMessage", "シリーズを削除しました。", "success");
    } catch (error) {
      message("seriesMessage", error.message, "error");
    }
  };

  // エピソード文字数
  $("episodeContent").addEventListener("input", () => {
    $("characterCount").textContent =
      $("episodeContent").value.length.toLocaleString() + "文字";
  });

  // エピソード作成・編集
  $("episodeForm").addEventListener("submit", async event => {
    event.preventDefault();

    const seriesId = $("episodeSeries").value;
    const title = $("episodeTitle").value.trim();
    const content = $("episodeContent").value;

    try {
      if (editingEpisodeId) {
        await api("updateEpisode", {
          seriesId, episodeId: editingEpisodeId, title, content
        });
        message("episodeMessage", "エピソードを更新しました。", "success");
      } else {
        await api("createEpisode", { seriesId, title, content });
        message("episodeMessage", "エピソードを追加しました。", "success");
      }

      resetEpisodeForm();
      await loadData();

      if ($("episodeListSeries").value === seriesId) renderEpisodes();
    } catch (error) {
      message("episodeMessage", error.message, "error");
    }
  });

  window.editEpisode = (seriesId, episodeId) => {
    const series = novelData.series.find(s => s.id === seriesId);
    const episode = series?.episodes?.find(e => e.id === episodeId);
    if (!episode) return;

    editingEpisodeId = episodeId;
    $("episodeSeries").value = seriesId;
    $("episodeTitle").value = episode.title || "";
    $("episodeContent").value = episode.content || "";
    $("characterCount").textContent =
      $("episodeContent").value.length.toLocaleString() + "文字";

    $("episodeFormHeading").textContent = "エピソード編集";
    $("episodeSubmitButton").textContent = "更新する";
    $("cancelEpisodeEdit").classList.remove("hidden");
    $("episodeForm").scrollIntoView({ behavior: "smooth" });
  };

  function resetEpisodeForm() {
    editingEpisodeId = null;
    $("episodeForm").reset();
    $("characterCount").textContent = "0文字";
    $("episodeFormHeading").textContent = "新規エピソード";
    $("episodeSubmitButton").textContent = "エピソードを追加";
    $("cancelEpisodeEdit").classList.add("hidden");
  }

  $("cancelEpisodeEdit").addEventListener("click", resetEpisodeForm);

  // エピソード一覧
  $("episodeListSeries").addEventListener("change", renderEpisodes);

  function renderEpisodes() {
    const seriesId = $("episodeListSeries").value;
    const series = novelData.series.find(s => s.id === seriesId);
    const list = $("episodeList");

    if (!series) {
      list.innerHTML = '<p class="message">シリーズを選択してください。</p>';
      return;
    }

    const episodes = series.episodes || [];

    if (!episodes.length) {
      list.innerHTML = '<p class="message">エピソードはまだありません。</p>';
      return;
    }

    list.innerHTML = episodes.map((episode, index) => `
      <div class="episode-card">
        <h4><span class="episode-order">${index + 1}.</span>${escapeHTML(episode.title)}</h4>
        <p class="card-info">${String(episode.content || "").length.toLocaleString()}文字</p>
        <div class="card-actions">
          <button type="button" onclick="editEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">編集</button>
          <button type="button" class="delete-button" onclick="deleteEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">削除</button>
          <button type="button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',-1)" ${index === 0 ? "disabled" : ""}>↑</button>
          <button type="button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',1)" ${index === episodes.length - 1 ? "disabled" : ""}>↓</button>
        </div>
      </div>
    `).join("");
  }

  window.deleteEpisode = async (seriesId, episodeId) => {
    if (!confirm("このエピソードを削除しますか？")) return;

    try {
      await api("deleteEpisode", { seriesId, episodeId });
      await loadData();
      renderEpisodes();
      message("episodeMessage", "エピソードを削除しました。", "success");
    } catch (error) {
      message("episodeMessage", error.message, "error");
    }
  };

  // エピソード順番変更
  window.moveEpisode = async (seriesId, episodeId, direction) => {
    const series = novelData.series.find(s => s.id === seriesId);
    if (!series) return;

    const episodes = [...(series.episodes || [])];
    const index = episodes.findIndex(e => e.id === episodeId);
    const next = index + direction;

    if (index < 0 || next < 0 || next >= episodes.length) return;

    [episodes[index], episodes[next]] = [episodes[next], episodes[index]];

    try {
      await api("reorderEpisodes", {
        seriesId,
        episodeIds: episodes.map(e => e.id)
      });
      await loadData();
      renderEpisodes();
    } catch (error) {
      message("episodeMessage", error.message, "error");
    }
  };

  // 名前変換設定
  function loadNameSettings() {
    $("surnameInput").value = localStorage.getItem("novelSurname") || "";
    $("nameInput").value = localStorage.getItem("novelName") || "";
  }

  $("saveNameButton").addEventListener("click", () => {
    localStorage.setItem("novelSurname", $("surnameInput").value);
    localStorage.setItem("novelName", $("nameInput").value);
    message("nameMessage", "名前を保存しました。", "success");
  });

  // ログアウト
  $("logoutButton").addEventListener("click", () => {
    sessionStorage.removeItem("novelAdminKey");
    adminKey = "";
    $("adminArea").classList.add("hidden");
    $("loginArea").classList.remove("hidden");
    $("adminKey").value = "";
    resetSeriesForm();
    resetEpisodeForm();
  });

  // 前回のログイン状態を復元
  (async () => {
    const savedKey = sessionStorage.getItem("novelAdminKey");
    if (!savedKey) return;

    adminKey = savedKey;

    try {
      await loadData();
      $("loginArea").classList.add("hidden");
      $("adminArea").classList.remove("hidden");
      loadNameSettings();
    } catch (error) {
      sessionStorage.removeItem("novelAdminKey");
      adminKey = "";
    }
  })();
</script>
</body>
</html>
