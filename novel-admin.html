<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>novel admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* murmur admin 専用デザインをnovel adminにも適用 */
    body { width:100%; }
    body > section {
      display:block;
      width:100%;
      max-width:none;
      margin-left:auto !important;
      margin-right:auto !important;
      padding-left:1.5em;
      padding-right:1.5em;
      box-sizing:border-box;
    }
    section h2 { text-align:center; }
    #adminArea > h3 {
      width:100%;
      max-width:425px;
      margin-left:auto;
      margin-right:auto;
      text-align:left;
    }
    .admin-form { width:100%; max-width:425px; margin:0 auto; text-align:left; }
    .admin-form label { display:block; margin-top:.8em; margin-bottom:.2em; color:#888; font-size:.9em; }
    .admin-form input, .admin-form select, .admin-form textarea {
      display:block; width:100%; -webkit-appearance:none; padding:.5em .7em;
      background-color:#999; border:none; border-radius:0; border-bottom-right-radius:20px;
      color:#fff; font-family:'Kosugi Maru',sans-serif; font-size:.9em; letter-spacing:.1em;
      outline:none; box-sizing:border-box;
    }
    .admin-form input, .admin-form select { height:40px; }
    .admin-form textarea { height:150px; resize:vertical; }
    .admin-form input::placeholder, .admin-form textarea::placeholder { color:#fff; opacity:1; }
    .admin-form button, .post-actions button, .list-button, .cancel-button {
      margin-top:1em; padding:.5em 1.2em; background-color:#999; border:none;
      border-bottom-right-radius:20px; color:#fff; font-family:'Kosugi Maru',sans-serif;
      font-size:.9em; letter-spacing:.1em; cursor:pointer;
    }
    .admin-form button:hover, .post-actions button:hover, .list-button:hover, .cancel-button:hover { opacity:.8; }
    .admin-form button:disabled { opacity:.35; cursor:default; }
    .cancel-button { background-color:#bbb; }
    .submit-area { text-align:left; }
    .message { margin:1.5em 0; text-align:center; line-height:1.8; }
    .error { color:#b66; } .success { color:#698b75; }
    .admin-divider { display:block; width:100%; max-width:600px; margin:3em auto; border:none; border-top:1px solid #ccc; box-sizing:border-box; }
    .list-area { max-width:600px; margin:0 auto; text-align:left; }
    .series-card, .episode-card { padding:1.2em 0; border-bottom:1px solid #ddd; }
    .series-card h4, .episode-card h4 { margin:0 0 .6em; color:#777; font-size:1em; font-weight:400; line-height:1.8; }
    .card-info { margin:.5em 0; color:#888; font-size:.85em; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
    .card-actions { display:flex; gap:.6em; flex-wrap:wrap; }
    .card-actions button { margin-top:.8em; }
    .delete-button { background-color:#b77f7f !important; }
    .hint { margin-top:.6em; color:#888; font-size:.9em; line-height:1.8; }
    .count { margin-top:.5em; text-align:right; color:#888; font-size:.85em; }
    .episode-order { color:#888; margin-right:.5em; }
    .empty-message { text-align:center; color:#888; padding:2em 0; }
    .hidden { display:none !important; }
    .back { margin-top:3em; text-align:center; }
    .back a { display:inline-block; padding:.5em 1.2em; background-color:#999; color:#fff; text-decoration:none; border-bottom-right-radius:20px; }
    .back a:hover { opacity:.8; }
    @media screen and (max-width:767px) {
      .card-info.date { display:inline-block; width:210px; max-width:100%; }
    }
  </style>
</head>
<body>
<section>
  <h2>novel admin</h2>
  <div id="loginArea">
    <form id="loginForm" class="admin-form">
      <label for="adminKey">管理キー</label><input type="password" id="adminKey" placeholder="管理キーを入力" autocomplete="current-password" required>
      <div class="submit-area"><button type="submit">管理画面を開く</button></div>
    </form>
    <p id="loginMessage" class="message"></p>
  </div>
  <div id="adminArea" class="hidden">
    <h3 id="seriesFormHeading">新規シリーズ</h3>
    <form id="seriesForm" class="admin-form">
      <label for="seriesTitle">シリーズ名</label><input type="text" id="seriesTitle" placeholder="シリーズ名" required>
      <label for="seriesCategory">種類</label><select id="seriesCategory"><option value="long">長編</option><option value="middle">中編</option><option value="short">短編</option></select>
      <label for="seriesSynopsis">あらすじ</label><textarea id="seriesSynopsis" placeholder="あらすじを入力"></textarea>
      <div class="submit-area"><button type="submit" id="seriesSubmitButton">シリーズを作成</button><button type="button" id="cancelSeriesEdit" class="hidden">キャンセル</button></div>
      <p id="seriesMessage" class="message"></p>
    </form>
    <hr class="admin-divider">
    <h3>SERIES LIST</h3><div id="seriesList" class="list-area"><p class="empty-message">シリーズはまだありません。</p></div>
    <hr class="admin-divider">
    <h3 id="episodeFormHeading">新規エピソード</h3>
    <form id="episodeForm" class="admin-form">
      <label for="episodeSeries">投稿先シリーズ</label><select id="episodeSeries" required><option value="">シリーズを選択</option></select>
      <label for="episodeTitle">エピソード名</label><input type="text" id="episodeTitle" placeholder="エピソード名" required>
      <label for="episodeContent">本文</label><textarea id="episodeContent" placeholder="小説本文を入力" required></textarea>
      <div class="count" id="characterCount">0文字</div>
      <div class="submit-area"><button type="submit" id="episodeSubmitButton">エピソードを追加</button><button type="button" id="cancelEpisodeEdit" class="hidden">キャンセル</button></div>
      <p id="episodeMessage" class="message"></p>
    </form>
    <hr class="admin-divider">
    <h3>EPISODE LIST</h3>
    <div class="admin-form"><label for="episodeListSeries">シリーズを選択</label><select id="episodeListSeries"><option value="">シリーズを選択</option></select></div>
    <div id="episodeList" class="list-area"><p class="empty-message">シリーズを選択してください。</p></div>
    <hr class="admin-divider">
    <div class="submit-area admin-form"><button type="button" id="logoutButton">ログアウト</button></div>
  </div>
  <div class="back"><a href="novel.html">BACK TO NOVEL</a></div>
  <div class="back"><a href="index.html">TOPへ戻る</a></div>
</section>
<script>
  const WORKER_URL = "https://novel-post.melodic-ars.workers.dev";
  let adminKey = "";
  let novelData = { series: [] };
  let editingSeriesId = null;
  let editingEpisodeId = null;
  const $ = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" })[char]);
  }
  function message(id, text, type = "") {
    $(id).textContent = text;
    $(id).className = "message " + type;
  }
  async function api(action, params = {}) {
    const response = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ action, adminKey, ...params }) });
    const result = await response.json();
    if (!response.ok || result.success === false) throw new Error(result.message || "通信に失敗しました。");
    return result;
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault(); adminKey = $("adminKey").value.trim();
    try {
      await loadData(); sessionStorage.setItem("novelAdminKey", adminKey);
      $("loginArea").classList.add("hidden"); $("adminArea").classList.remove("hidden");
    } catch (error) { adminKey = ""; message("loginMessage", error.message, "error"); }
  });

  async function loadData() {
    const result = await api("list"); novelData = result.data || { series: [] };
    if (!Array.isArray(novelData.series)) novelData.series = [];
    renderSeries(); updateSeriesSelects();
    if ($("episodeListSeries").value) renderEpisodes();
  }
  function renderSeries() {
    const list = $("seriesList");
    if (!novelData.series.length) { list.innerHTML = '<p class="empty-message">シリーズはまだありません。</p>'; return; }
    const categoryNames = { long:"長編", middle:"中編", short:"短編" };
    list.innerHTML = novelData.series.map(series => `
      <div class="series-card"><h4>${escapeHTML(series.title)}</h4>
      <p class="card-info">種類：${escapeHTML(categoryNames[series.category] || "")}</p>
      <div class="post-meta"><span class="post-type">${escapeHTML(categoryNames[series.category] || "")}</span><span>エピソード数：${(series.episodes || []).length}</span></div>
      <div class="post-body">${escapeHTML(series.synopsis || "あらすじ未設定")}</div>
      <div class="card-actions"><button type="button" onclick="editSeries('${escapeHTML(series.id)}')">編集</button>
      <button type="button" class="delete-button" onclick="deleteSeries('${escapeHTML(series.id)}')">削除</button></div></div>`).join("");
  }
  function updateSeriesSelects() {
    const options = novelData.series.map(series => `<option value="${escapeHTML(series.id)}">${escapeHTML(series.title)}</option>`).join("");
    const episodeSelect = $("episodeSeries"), listSelect = $("episodeListSeries");
    const oldEpisode = episodeSelect.value, oldList = listSelect.value;
    episodeSelect.innerHTML = '<option value="">シリーズを選択</option>' + options;
    listSelect.innerHTML = '<option value="">シリーズを選択</option>' + options;
    if (novelData.series.some(s => s.id === oldEpisode)) episodeSelect.value = oldEpisode;
    if (novelData.series.some(s => s.id === oldList)) listSelect.value = oldList;
  }

  $("seriesForm").addEventListener("submit", async event => {
    event.preventDefault();
    const params = { title:$("seriesTitle").value.trim(), category:$("seriesCategory").value, synopsis:$("seriesSynopsis").value.trim() };
    try {
      if (editingSeriesId) { await api("updateSeries", { seriesId:editingSeriesId, ...params }); message("seriesMessage", "シリーズを更新しました。", "success"); }
      else { await api("createSeries", params); message("seriesMessage", "シリーズを作成しました。", "success"); }
      resetSeriesForm(); await loadData();
    } catch (error) { message("seriesMessage", error.message, "error"); }
  });
  window.editSeries = id => {
    const series = novelData.series.find(s => s.id === id); if (!series) return;
    editingSeriesId = id; $("seriesTitle").value = series.title || ""; $("seriesCategory").value = series.category || "long";
    $("seriesSynopsis").value = series.synopsis || ""; $("seriesFormHeading").textContent = "シリーズ編集";
    $("seriesSubmitButton").textContent = "更新する"; $("cancelSeriesEdit").classList.remove("hidden");
    $("seriesForm").scrollIntoView({ behavior:"smooth" });
  };
  function resetSeriesForm() {
    editingSeriesId = null; $("seriesForm").reset(); $("seriesFormHeading").textContent = "新規シリーズ";
    $("seriesSubmitButton").textContent = "シリーズを作成"; $("cancelSeriesEdit").classList.add("hidden");
  }
  $("cancelSeriesEdit").addEventListener("click", resetSeriesForm);
  window.deleteSeries = async id => {
    const series = novelData.series.find(s => s.id === id); if (!series || !confirm(`「${series.title}」とそのエピソードを削除しますか？`)) return;
    try { await api("deleteSeries", { seriesId:id }); await loadData(); message("seriesMessage", "シリーズを削除しました。", "success"); }
    catch (error) { message("seriesMessage", error.message, "error"); }
  };

  $("episodeContent").addEventListener("input", () => { $("characterCount").textContent = $("episodeContent").value.length.toLocaleString() + "文字"; });
  $("episodeForm").addEventListener("submit", async event => {
    event.preventDefault(); const seriesId = $("episodeSeries").value, title = $("episodeTitle").value.trim(), content = $("episodeContent").value;
    try {
      if (editingEpisodeId) { await api("updateEpisode", { seriesId, episodeId:editingEpisodeId, title, content }); message("episodeMessage", "エピソードを更新しました。", "success"); }
      else { await api("createEpisode", { seriesId, title, content }); message("episodeMessage", "エピソードを追加しました。", "success"); }
      resetEpisodeForm(); await loadData(); if ($("episodeListSeries").value === seriesId) renderEpisodes();
    } catch (error) { message("episodeMessage", error.message, "error"); }
  });
  window.editEpisode = (seriesId, episodeId) => {
    const series = novelData.series.find(s => s.id === seriesId), episode = series?.episodes?.find(e => e.id === episodeId); if (!episode) return;
    editingEpisodeId = episodeId; $("episodeSeries").value = seriesId; $("episodeTitle").value = episode.title || "";
    $("episodeContent").value = episode.content || ""; $("characterCount").textContent = $("episodeContent").value.length.toLocaleString() + "文字";
    $("episodeFormHeading").textContent = "エピソード編集"; $("episodeSubmitButton").textContent = "更新する";
    $("cancelEpisodeEdit").classList.remove("hidden"); $("episodeForm").scrollIntoView({ behavior:"smooth" });
  };
  function resetEpisodeForm() {
    editingEpisodeId = null; $("episodeForm").reset(); $("characterCount").textContent = "0文字";
    $("episodeFormHeading").textContent = "新規エピソード"; $("episodeSubmitButton").textContent = "エピソードを追加";
    $("cancelEpisodeEdit").classList.add("hidden");
  }
  $("cancelEpisodeEdit").addEventListener("click", resetEpisodeForm);
  $("episodeListSeries").addEventListener("change", renderEpisodes);
  function renderEpisodes() {
    const seriesId = $("episodeListSeries").value, series = novelData.series.find(s => s.id === seriesId), list = $("episodeList");
    if (!series) { list.innerHTML = '<p class="empty-message">シリーズを選択してください。</p>'; return; }
    const episodes = series.episodes || [];
    if (!episodes.length) { list.innerHTML = '<p class="empty-message">エピソードはまだありません。</p>'; return; }
    list.innerHTML = episodes.map((episode, index) => `
      <div class="episode-card"><h4><span class="episode-order">${index + 1}.</span>${escapeHTML(episode.title)}</h4>
      <div class="post-meta"><span class="card-info date">${String(episode.content || "").length.toLocaleString()}文字</span></div>
      <div class="post-body">${escapeHTML(episode.content || "")}</div>
      <div class="card-actions"><button type="button" onclick="editEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">編集</button>
      <button type="button" class="delete-button" onclick="deleteEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">削除</button>
      <button type="button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',-1)" ${index === 0 ? "disabled" : ""}>↑</button>
      <button type="button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',1)" ${index === episodes.length - 1 ? "disabled" : ""}>↓</button></div></div>`).join("");
  }
  window.deleteEpisode = async (seriesId, episodeId) => {
    if (!confirm("このエピソードを削除しますか？")) return;
    try { await api("deleteEpisode", { seriesId, episodeId }); await loadData(); renderEpisodes(); message("episodeMessage", "エピソードを削除しました。", "success"); }
    catch (error) { message("episodeMessage", error.message, "error"); }
  };
  window.moveEpisode = async (seriesId, episodeId, direction) => {
    const series = novelData.series.find(s => s.id === seriesId); if (!series) return;
    const episodes = [...(series.episodes || [])], index = episodes.findIndex(e => e.id === episodeId), next = index + direction;
    if (index < 0 || next < 0 || next >= episodes.length) return;
    [episodes[index], episodes[next]] = [episodes[next], episodes[index]];
    try { await api("reorderEpisodes", { seriesId, episodeIds:episodes.map(e => e.id) }); await loadData(); renderEpisodes(); }
    catch (error) { message("episodeMessage", error.message, "error"); }
  };

  $("logoutButton").addEventListener("click", () => {
    sessionStorage.removeItem("novelAdminKey"); adminKey = ""; $("adminArea").classList.add("hidden");
    $("loginArea").classList.remove("hidden"); $("adminKey").value = ""; resetSeriesForm(); resetEpisodeForm();
  });
  (async () => {
    const savedKey = sessionStorage.getItem("novelAdminKey"); if (!savedKey) return; adminKey = savedKey;
    try { await loadData(); $("loginArea").classList.add("hidden"); $("adminArea").classList.remove("hidden"); }
    catch (error) { sessionStorage.removeItem("novelAdminKey"); adminKey = ""; }
  })();
</script>
</body>
</html>
