
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>novel admin</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #fff;
      color: #888;
      font-family: "Kosugi Maru", sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    main {
      width: 100%;
      padding: 3em 1.5em;
      box-sizing: border-box;
    }

    section {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 3em;
      text-align: center;
      font-family: "Unica One", sans-serif;
      font-size: 2em;
      font-weight: bold;
      color: #888;
    }

    h3 {
      margin: 2.5em 0 1.5em;
      text-align: center;
      font-family: "Unica One", sans-serif;
      font-size: 1.4em;
      color: #888;
    }

    p {
      line-height: 1.9;
    }

    .admin-form {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .admin-form label,
    .field-label {
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.6em;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.8em;
      border: none;
      border-radius: 0;
      background: #999;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    input::placeholder,
    textarea::placeholder {
      color: #eee;
    }

    select {
      cursor: pointer;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.8;
    }

    button {
      padding: 0.7em 2em;
      border: none;
      border-radius: 0;
      background: #999;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.75;
    }

    .submit-area {
      margin-top: 2em;
      text-align: center;
    }

    .admin-divider {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 3em auto;
      border: none;
      border-top: 1px solid #ccc;
      box-sizing: border-box;
    }

    .message {
      margin: 1.5em 0;
      text-align: center;
      line-height: 1.8;
    }

    .error {
      color: #b66;
    }

    .success {
      color: #698b75;
    }

    .series-card,
    .episode-card {
      margin: 1.5em 0;
      padding: 1.5em;
      border: 1px solid #ccc;
      background: #fff;
    }

    .series-card h4,
    .episode-card h4 {
      margin: 0 0 0.8em;
      color: #777;
      font-size: 1.1em;
      font-weight: normal;
      line-height: 1.8;
    }

    .card-info {
      margin: 0.5em 0;
      color: #999;
      font-size: 0.9em;
      line-height: 1.8;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7em;
      margin-top: 1.2em;
    }

    .card-actions button {
      padding: 0.6em 1em;
      font-size: 12px;
    }

    .delete-button {
      background: #b88c8c;
    }

    .small-button {
      padding: 0.5em 0.8em !important;
    }

    .back {
      margin-top: 3em;
      text-align: center;
    }

    .back a {
      display: inline-block;
      padding: 0.7em 2em;
      background: #999;
      color: #fff;
      text-decoration: none;
      border-radius: 0;
    }

    .back a:hover {
      opacity: 0.75;
    }

    .hidden {
      display: none;
    }

    .hint {
      margin-top: 0.6em;
      color: #aaa;
      font-size: 11px;
      line-height: 1.8;
    }

    .count {
      margin-top: 0.5em;
      text-align: right;
      color: #aaa;
      font-size: 11px;
    }

    .episode-list {
      margin-top: 1em;
    }

    .episode-order {
      display: inline-block;
      margin-right: 0.5em;
      color: #aaa;
    }

    @media (max-width: 600px) {
      main {
        padding: 2em 1em;
      }

      .series-card,
      .episode-card {
        padding: 1em;
      }
    }
  </style>
</head>

<body>
<main>
  <section>
    <h2>novel admin</h2>

    <!-- ログイン -->
    <div id="loginArea">
      <form id="loginForm" class="admin-form">
        <label for="adminKey">ADMIN KEY</label>
        <input
          type="password"
          id="adminKey"
          placeholder="管理キーを入力"
          autocomplete="current-password"
          required
        >
        <div class="submit-area">
          <button type="submit">LOGIN</button>
        </div>
      </form>
      <p id="loginMessage" class="message"></p>
    </div>

    <!-- 管理画面 -->
    <div id="adminArea" class="hidden">

      <!-- 名前変換 -->
      <h3>NAME CHANGE</h3>
      <div class="admin-form">
        <p>
          小説内の名前を変更できます。設定はこのブラウザに保存されます。
        </p>

        <label for="surnameInput">SURNAME / 姓</label>
        <input
          type="text"
          id="surnameInput"
          placeholder="姓を入力"
        >

        <label for="nameInput">NAME / 名</label>
        <input
          type="text"
          id="nameInput"
          placeholder="名を入力"
        >

        <p class="hint">
          小説本文では {surname} が姓、{name} が名に置き換わります。
        </p>

        <div class="submit-area">
          <button type="button" id="saveNameButton">SAVE NAME</button>
        </div>
        <p id="nameMessage" class="message"></p>
      </div>

      <hr class="admin-divider">

      <!-- シリーズ作成・編集 -->
      <h3 id="seriesFormHeading">NEW SERIES</h3>

      <form id="seriesForm" class="admin-form">
        <label for="seriesTitle">TITLE / シリーズ名</label>
        <input
          type="text"
          id="seriesTitle"
          placeholder="シリーズ名"
          required
        >

        <label for="seriesCategory">CATEGORY / 種類</label>
        <select id="seriesCategory">
          <option value="long">長編</option>
          <option value="middle">中編</option>
          <option value="short">短編</option>
        </select>

        <label for="seriesSynopsis">SYNOPSIS / あらすじ</label>
        <textarea
          id="seriesSynopsis"
          placeholder="あらすじを入力"
          rows="5"
        ></textarea>

        <div class="submit-area">
          <button type="submit" id="seriesSubmitButton">CREATE SERIES</button>
          <button type="button" id="cancelSeriesEdit" class="hidden">CANCEL</button>
        </div>
        <p id="seriesMessage" class="message"></p>
      </form>

      <hr class="admin-divider">

      <!-- シリーズ一覧 -->
      <h3>SERIES LIST</h3>
      <div id="seriesList" class="admin-form">
        <p class="message">ログインしてください。</p>
      </div>

      <hr class="admin-divider">

      <!-- エピソード作成・編集 -->
      <h3 id="episodeFormHeading">NEW EPISODE</h3>

      <form id="episodeForm" class="admin-form">
        <label for="episodeSeries">SERIES / 投稿先</label>
        <select id="episodeSeries" required>
          <option value="">シリーズを選択</option>
        </select>

        <label for="episodeTitle">TITLE / エピソード名</label>
        <input
          type="text"
          id="episodeTitle"
          placeholder="エピソード名"
          required
        >

        <label for="episodeContent">STORY / 本文</label>
        <textarea
          id="episodeContent"
          placeholder="小説本文を入力"
          rows="20"
          required
        ></textarea>
        <div class="count" id="characterCount">0文字</div>

        <div class="submit-area">
          <button type="submit" id="episodeSubmitButton">CREATE EPISODE</button>
          <button type="button" id="cancelEpisodeEdit" class="hidden">CANCEL</button>
        </div>
        <p id="episodeMessage" class="message"></p>
      </form>

      <hr class="admin-divider">

      <!-- エピソード一覧 -->
      <h3>EPISODE LIST</h3>
      <div class="admin-form">
        <label for="episodeListSeries">SERIES / 表示するシリーズ</label>
        <select id="episodeListSeries">
          <option value="">シリーズを選択</option>
        </select>
        <div id="episodeList" class="episode-list">
          <p class="message">シリーズを選択してください。</p>
        </div>
      </div>

      <hr class="admin-divider">

      <div class="submit-area">
        <button type="button" id="logoutButton">LOGOUT</button>
      </div>
    </div>

    <div class="back">
      <a href="novel.html">BACK TO NOVEL</a>
    </div>

    <div class="back">
      <a href="index.html">TOPへ戻る</a>
    </div>
  </section>
</main>

<script>
  // Cloudflare Workers のURLに置き換えてください
  const WORKER_URL = "https://novel-post.あなたのサブドメイン.workers.dev";

  let adminKey = "";
  let novelData = { series: [] };
  let editingSeriesId = null;
  let editingEpisodeId = null;

  const $ = (id) => document.getElementById(id);

  // HTMLエスケープ
  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  // Workerとの通信
  async function api(action, params = {}) {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action,
        adminKey,
        ...params
      })
    });

    const result = await response.json();

    if (!response.ok || result.success === false) {
      throw new Error(result.message || "通信に失敗しました。");
    }

    return result;
  }

  function showMessage(id, message, type = "") {
    const element = $(id);
    element.textContent = message;
    element.className = "message " + type;
  }

  // ログイン
  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    adminKey = $("adminKey").value.trim();

    if (!adminKey) return;

    try {
      await loadData();

      sessionStorage.setItem("novelAdminKey", adminKey);
      $("loginArea").classList.add("hidden");
      $("adminArea").classList.remove("hidden");

      loadNameSettings();
      renderSeries();
    } catch (error) {
      adminKey = "";
      showMessage("loginMessage", error.message, "error");
    }
  });

  // データ読み込み
  async function loadData() {
    const result = await api("list");
    novelData = result.data || { series: [] };

    if (!Array.isArray(novelData.series)) {
      novelData.series = [];
    }

    renderSeries();
    updateSeriesSelects();
  }

  // シリーズ一覧表示
  function renderSeries() {
    const list = $("seriesList");

    if (!novelData.series.length) {
      list.innerHTML = '<p class="message">シリーズはまだありません。</p>';
      return;
    }

    list.innerHTML = novelData.series.map((series) => {
      const categoryNames = {
        long: "長編",
        middle: "中編",
        short: "短編"
      };

      const episodeCount = (series.episodes || []).length;

      return `
        <div class="series-card">
          <h4>${escapeHTML(series.title)}</h4>
          <p class="card-info">
            種類：${escapeHTML(categoryNames[series.category] || series.category || "")}
          </p>
          <p class="card-info">
            エピソード数：${episodeCount}
          </p>
          <p class="card-info">
            ${escapeHTML(series.synopsis || "あらすじ未設定")}
          </p>
          <div class="card-actions">
            <button type="button" onclick="editSeries('${escapeHTML(series.id)}')">EDIT</button>
            <button type="button" class="delete-button" onclick="deleteSeries('${escapeHTML(series.id)}')">DELETE</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // シリーズ選択欄を更新
  function updateSeriesSelects() {
    const options = novelData.series.map((series) => `
      <option value="${escapeHTML(series.id)}">${escapeHTML(series.title)}</option>
    `).join("");

    const episodeSelect = $("episodeSeries");
    const listSelect = $("episodeListSeries");

    const previousEpisodeValue = episodeSelect.value;
    const previousListValue = listSelect.value;

    episodeSelect.innerHTML =
      '<option value="">シリーズを選択</option>' + options;

    listSelect.innerHTML =
      '<option value="">シリーズを選択</option>' + options;

    if (novelData.series.some(s => s.id === previousEpisodeValue)) {
      episodeSelect.value = previousEpisodeValue;
    }

    if (novelData.series.some(s => s.id === previousListValue)) {
      listSelect.value = previousListValue;
    }
  }

  // シリーズ作成・更新
  $("seriesForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const params = {
      title: $("seriesTitle").value.trim(),
      category: $("seriesCategory").value,
      synopsis: $("seriesSynopsis").value.trim()
    };

    if (!params.title) return;

    try {
      if (editingSeriesId) {
        await api("updateSeries", {
          seriesId: editingSeriesId,
          ...params
        });
        showMessage("seriesMessage", "シリーズを更新しました。", "success");
      } else {
        await api("createSeries", params);
        showMessage("seriesMessage", "シリーズを作成しました。", "success");
      }

      resetSeriesForm();
      await loadData();
    } catch (error) {
      showMessage("seriesMessage", error.message, "error");
    }
  });

  // シリーズ編集
  window.editSeries = function(id) {
    const series = novelData.series.find(s => s.id === id);
    if (!series) return;

    editingSeriesId = id;

    $("seriesTitle").value = series.title || "";
    $("seriesCategory").value = series.category || "long";
    $("seriesSynopsis").value = series.synopsis || "";

    $("seriesFormHeading").textContent = "EDIT SERIES";
    $("seriesSubmitButton").textContent = "UPDATE SERIES";
    $("cancelSeriesEdit").classList.remove("hidden");

    $("seriesForm").scrollIntoView({ behavior: "smooth" });
  };

  // シリーズ編集キャンセル
  function resetSeriesForm() {
    editingSeriesId = null;
    $("seriesForm").reset();
    $("seriesFormHeading").textContent = "NEW SERIES";
    $("seriesSubmitButton").textContent = "CREATE SERIES";
    $("cancelSeriesEdit").classList.add("hidden");
  }

  $("cancelSeriesEdit").addEventListener("click", resetSeriesForm);

  // シリーズ削除
  window.deleteSeries = async function(id) {
    const series = novelData.series.find(s => s.id === id);
    if (!series) return;

    const confirmed = confirm(
      `「${series.title}」を削除しますか？\nシリーズ内のエピソードもすべて削除されます。`
    );

    if (!confirmed) return;

    try {
      await api("deleteSeries", { seriesId: id });
      await loadData();
      showMessage("seriesMessage", "シリーズを削除しました。", "success");
    } catch (error) {
      showMessage("seriesMessage", error.message, "error");
    }
  };

  // エピソード文字数
  $("episodeContent").addEventListener("input", () => {
    $("characterCount").textContent =
      $("episodeContent").value.length.toLocaleString() + "文字";
  });

  // エピソード作成・更新
  $("episodeForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const seriesId = $("episodeSeries").value;
    const title = $("episodeTitle").value.trim();
    const content = $("episodeContent").value;

    if (!seriesId || !title || !content) {
      showMessage("episodeMessage", "入力内容を確認してください。", "error");
      return;
    }

    try {
      if (editingEpisodeId) {
        await api("updateEpisode", {
          seriesId,
          episodeId: editingEpisodeId,
          title,
          content
        });
        showMessage("episodeMessage", "エピソードを更新しました。", "success");
      } else {
        await api("createEpisode", {
          seriesId,
          title,
          content
        });
        showMessage("episodeMessage", "エピソードを追加しました。", "success");
      }

      resetEpisodeForm();
      await loadData();

      if ($("episodeListSeries").value === seriesId) {
        renderEpisodes();
      }
    } catch (error) {
      showMessage("episodeMessage", error.message, "error");
    }
  });

  // エピソード編集
  window.editEpisode = function(seriesId, episodeId) {
    const series = novelData.series.find(s => s.id === seriesId);
    if (!series) return;

    const episode = (series.episodes || []).find(e => e.id === episodeId);
    if (!episode) return;

    editingEpisodeId = episodeId;

    $("episodeSeries").value = seriesId;
    $("episodeTitle").value = episode.title || "";
    $("episodeContent").value = episode.content || "";

    $("characterCount").textContent =
      $("episodeContent").value.length.toLocaleString() + "文字";

    $("episodeFormHeading").textContent = "EDIT EPISODE";
    $("episodeSubmitButton").textContent = "UPDATE EPISODE";
    $("cancelEpisodeEdit").classList.remove("hidden");

    $("episodeForm").scrollIntoView({ behavior: "smooth" });
  };

  function resetEpisodeForm() {
    editingEpisodeId = null;
    $("episodeForm").reset();
    $("characterCount").textContent = "0文字";
    $("episodeFormHeading").textContent = "NEW EPISODE";
    $("episodeSubmitButton").textContent = "CREATE EPISODE";
    $("cancelEpisodeEdit").classList.add("hidden");
  }

  $("cancelEpisodeEdit").addEventListener("click", resetEpisodeForm);

  // エピソード一覧
  $("episodeListSeries").addEventListener("change", renderEpisodes);

  function renderEpisodes() {
    const seriesId = $("episodeListSeries").value;
    const list = $("episodeList");

    const series = novelData.series.find(s => s.id === seriesId);

    if (!series) {
      list.innerHTML = '<p class="message">シリーズを選択してください。</p>';
      return;
    }

    const episodes = series.episodes || [];

    if (!episodes.length) {
      list.innerHTML = '<p class="message">エピソードはまだありません。</p>';
      return;
    }

    list.innerHTML = episodes.map((episode, index) => `
      <div class="episode-card">
        <h4>
          <span class="episode-order">${index + 1}.</span>
          ${escapeHTML(episode.title)}
        </h4>
        <p class="card-info">
          ${String(episode.content || "").length.toLocaleString()}文字
        </p>
        <div class="card-actions">
          <button type="button" onclick="editEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">EDIT</button>
          <button type="button" class="delete-button" onclick="deleteEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}')">DELETE</button>
          <button type="button" class="small-button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',-1)" ${index === 0 ? "disabled" : ""}>↑</button>
          <button type="button" class="small-button" onclick="moveEpisode('${escapeHTML(seriesId)}','${escapeHTML(episode.id)}',1)" ${index === episodes.length - 1 ? "disabled" : ""}>↓</button>
        </div>
      </div>
    `).join("");
  }

  // エピソード削除
  window.deleteEpisode = async function(seriesId, episodeId) {
    if (!confirm("このエピソードを削除しますか？")) return;

    try {
      await api("deleteEpisode", { seriesId, episodeId });
      await loadData();
      renderEpisodes();
      showMessage("episodeMessage", "エピソードを削除しました。", "success");
    } catch (error) {
      showMessage("episodeMessage", error.message, "error");
    }
  };

  // エピソード順番変更
  window.moveEpisode = async function(seriesId, episodeId, direction) {
    const series = novelData.series.find(s => s.id === seriesId);
    if (!series) return;

    const episodes = [...(series.episodes || [])];
    const index = episodes.findIndex(e => e.id === episodeId);
    const nextIndex = index + direction;

    if (index < 0 || nextIndex < 0 || nextIndex >= episodes.length) return;

    [episodes[index], episodes[nextIndex]] =
      [episodes[nextIndex], episodes[index]];

    try {
      await api("reorderEpisodes", {
        seriesId,
        episodeIds: episodes.map(e => e.id)
      });

      await loadData();
      renderEpisodes();
    } catch (error) {
      showMessage("episodeMessage", error.message, "error");
    }
  };

  // 名前設定読み込み
  function loadNameSettings() {
    $("surnameInput").value = localStorage.getItem("novelSurname") || "";
    $("nameInput").value = localStorage.getItem("novelName") || "";
  }

  // 名前設定保存
  $("saveNameButton").addEventListener("click", () => {
    localStorage.setItem("novelSurname", $("surnameInput").value);
    localStorage.setItem("novelName", $("nameInput").value);

    showMessage("nameMessage", "名前を保存しました。", "success");
  });

  // ログアウト
  $("logoutButton").addEventListener("click", () => {
    sessionStorage.removeItem("novelAdminKey");
    adminKey = "";
    $("adminArea").classList.add("hidden");
    $("loginArea").classList.remove("hidden");
    $("adminKey").value = "";
    resetSeriesForm();
    resetEpisodeForm();
  });

  // 前回ログイン状態の復元
  (async function restoreLogin() {
    const savedKey = sessionStorage.getItem("novelAdminKey");
    if (!savedKey) return;

    adminKey = savedKey;

    try {
      await loadData();
      $("loginArea").classList.add("hidden");
      $("adminArea").classList.remove("hidden");
      loadNameSettings();
    } catch (error) {
      sessionStorage.removeItem("novelAdminKey");
      adminKey = "";
    }
  })();
</script>
</body>
</html>
